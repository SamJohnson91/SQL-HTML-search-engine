{label:"Steg 3 · Etter 3NF (ferdig)",code:"-- 3NF: forlag og sjanger i egne tabeller\nCREATE TABLE forlag (\n  id   INT AUTO_INCREMENT PRIMARY KEY,\n  navn VARCHAR(100) NOT NULL,\n  by   VARCHAR(100),\n  land VARCHAR(100) DEFAULT 'Norge'\n);\nCREATE TABLE sjangere (\n  id   INT AUTO_INCREMENT PRIMARY KEY,\n  navn VARCHAR(100) UNIQUE\n);\nCREATE TABLE forfattere (\n  id           INT AUTO_INCREMENT PRIMARY KEY,\n  fornavn      VARCHAR(100),\n  etternavn    VARCHAR(100),\n  født         YEAR,\n  nasjonalitet VARCHAR(50)\n);\nCREATE TABLE bøker (\n  isbn       VARCHAR(13) PRIMARY KEY,\n  tittel     VARCHAR(300) NOT NULL,\n  utgitt_år  YEAR,\n  sjanger_id INT,\n  forlag_id  INT,\n  ant_eks    INT DEFAULT 1,\n  FOREIGN KEY (sjanger_id) REFERENCES sjangere(id),\n  FOREIGN KEY (forlag_id)  REFERENCES forlag(id)\n);\nCREATE TABLE bok_forfattere (\n  isbn         VARCHAR(13),\n  forfatter_id INT,\n  rolle        ENUM('Forfatter','Medforfatter','Oversetter') DEFAULT 'Forfatter',\n  PRIMARY KEY (isbn, forfatter_id),\n  FOREIGN KEY (isbn)         REFERENCES bøker(isbn) ON DELETE CASCADE,\n  FOREIGN KEY (forfatter_id) REFERENCES forfattere(id)\n);\nCREATE TABLE lånere (\n  id     INT AUTO_INCREMENT PRIMARY KEY,\n  navn   VARCHAR(100) NOT NULL,\n  epost  VARCHAR(200) UNIQUE NOT NULL,\n  postnr CHAR(4),\n  status ENUM('Aktiv','Suspendert') DEFAULT 'Aktiv'\n);\nCREATE TABLE utlån (\n  id        INT AUTO_INCREMENT PRIMARY KEY,\n  låner_id  INT NOT NULL,\n  isbn      VARCHAR(13) NOT NULL,\n  dato      DATETIME DEFAULT CURRENT_TIMESTAMP,\n  forfaller DATE NOT NULL,\n  returdato DATETIME DEFAULT NULL,\n  FOREIGN KEY (låner_id) REFERENCES lånere(id),\n  FOREIGN KEY (isbn)     REFERENCES bøker(isbn)\n);"},
{label:"Steg 4 · Bok med forfattere",code:"SELECT b.tittel, b.utgitt_år,\n  GROUP_CONCAT(\n    CONCAT(f.fornavn, ' ', f.etternavn) SEPARATOR ', '\n  ) AS forfattere,\n  s.navn AS sjanger,\n  fl.navn AS forlag\nFROM bøker b\nJOIN bok_forfattere bf ON bf.isbn = b.isbn\nJOIN forfattere f      ON f.id = bf.forfatter_id\nJOIN sjangere s        ON s.id = b.sjanger_id\nJOIN forlag fl         ON fl.id = b.forlag_id\nGROUP BY b.isbn, b.tittel, b.utgitt_år, s.navn, fl.navn;"},
{label:"Steg 5 · Aktive utlån",code:"SELECT l.navn AS låner, b.tittel, u.dato AS lånt,\n  u.forfaller,\n  CASE\n    WHEN u.forfaller < CURDATE() THEN 'Forfalt'\n    WHEN u.forfaller <= DATE_ADD(CURDATE(),INTERVAL 7 DAY) THEN 'Snart forfaller'\n    ELSE 'OK'\n  END AS status\nFROM utlån u\nJOIN lånere l ON l.id = u.låner_id\nJOIN bøker b  ON b.isbn = u.isbn\nWHERE u.returdato IS NULL\nORDER BY u.forfaller;"}
]},
{id:"er-flyselskap",cmd:"ER-modell: Flyselskap",cat:"er",catLabel:"ER-MODELL",
desc:"Normaliser et flyselskap-system med flyvninger, passasjerer, fly og bookinger.",
tags:["er","flyselskap","fly","passasjer","booking","flyvning","sete","flyplass"],
difficulty:"advanced",related:["nrm-1nf","nrm-2nf","nrm-3nf"],
steps:[
{s:"<strong>0NF</strong> — Flat struktur med all info per booking"},
{s:"<strong>1NF</strong> — Fjern gjentagende grupper (multiple passasjerer per booking)"},
{s:"<strong>2NF</strong> — Skill flyvning, passasjer, sete fra booking"},
{s:"<strong>3NF</strong> — Fjern transitive avhengigheter (flyplass→by, fly_type→kapasitet)"},
{s:"<strong>Komplett schema</strong> — Realistisk flyselskap-database"}
],
examples:[
{label:"Steg 0 · Unormalisert",code:"-- 0NF: alt i én tabell\n-- booking_id, dato,\n-- pass1_navn, pass1_pass, pass1_sete,\n-- pass2_navn, pass2_pass, pass2_sete,\n-- pass3_navn, pass3_pass, pass3_sete,\n-- flyvning_nr, avgang, ankomst,\n-- fra_kode, fra_by, fra_land,\n-- til_kode, til_by, til_land,\n-- fly_reg, fly_type, fly_kapasitet,\n-- pris\n-- Problemer:\n-- Gjentagende passasjerer\n-- Flyplass-info gjentas\n-- fly_type → fly_kapasitet (transitiv)"},
{label:"Steg 1 · Etter 1NF",code:"-- 1NF: én rad per passasjer per booking\nCREATE TABLE booking_pass_1nf (\n  booking_id  INT,\n  dato        DATE,\n  pass_navn   VARCHAR(100),\n  pass_pass   VARCHAR(20),\n  pass_sete   VARCHAR(5),\n  flyvning_nr VARCHAR(10),\n  avgang      DATETIME,\n  fra_kode    CHAR(3),\n  fra_by      VARCHAR(100),\n  til_kode    CHAR(3),\n  til_by      VARCHAR(100),\n  fly_reg     VARCHAR(10),\n  fly_type    VARCHAR(50),\n  fly_kap     INT,\n  pris        DECIMAL(10,2),\n  PRIMARY KEY (booking_id, pass_pass)\n);"},
{label:"Steg 2 · Etter 2NF",code:"-- 2NF: skill ut entiteter\nCREATE TABLE flyplasser_2nf (\n  kode CHAR(3) PRIMARY KEY,\n  by   VARCHAR(100),\n  land VARCHAR(100)\n);\nCREATE TABLE fly_2nf (\n  reg  VARCHAR(10) PRIMARY KEY,\n  type VARCHAR(50),  -- transitiv (3NF-brudd: type→kapasitet)\n  kap  INT\n);\nCREATE TABLE flyvninger_2nf (\n  nr       VARCHAR(10) PRIMARY KEY,\n  avgang   DATETIME,\n  ankomst  DATETIME,\n  fra_kode CHAR(3),\n  til_kode CHAR(3),\n  fly_reg  VARCHAR(10),\n  pris     DECIMAL(10,2),\n  FOREIGN KEY (fra_kode) REFERENCES flyplasser_2nf(kode),\n  FOREIGN KEY (til_kode) REFERENCES flyplasser_2nf(kode),\n  FOREIGN KEY (fly_reg)  REFERENCES fly_2nf(reg)\n);\nCREATE TABLE passasjerer_2nf (\n  pass_nr VARCHAR(20) PRIMARY KEY,\n  navn    VARCHAR(100)\n);\nCREATE TABLE bookinger_2nf (\n  id   INT AUTO_INCREMENT PRIMARY KEY,\n  dato DATE\n);\nCREATE TABLE booking_passasjerer_2nf (\n  booking_id INT,\n  pass_nr    VARCHAR(20),\n  sete       VARCHAR(5),\n  PRIMARY KEY (booking_id, pass_nr),\n  FOREIGN KEY (booking_id) REFERENCES bookinger_2nf(id),\n  FOREIGN KEY (pass_nr)    REFERENCES passasjerer_2nf(pass_nr)\n);"},
{label:"Steg 3 · Etter 3NF (ferdig)",code:"-- 3NF: fly_type i egen tabell, flyplasser allerede skilt\nCREATE TABLE flytyper (\n  kode      VARCHAR(20) PRIMARY KEY,\n  navn      VARCHAR(100),\n  produsent VARCHAR(50),\n  kapasitet INT NOT NULL CHECK(kapasitet > 0)\n);\nCREATE TABLE land (\n  kode CHAR(2) PRIMARY KEY,\n  navn VARCHAR(100) NOT NULL\n);\nCREATE TABLE flyplasser (\n  kode      CHAR(3) PRIMARY KEY,\n  navn      VARCHAR(200),\n  by        VARCHAR(100),\n  land_kode CHAR(2),\n  FOREIGN KEY (land_kode) REFERENCES land(kode)\n);\nCREATE TABLE fly (\n  reg            VARCHAR(10) PRIMARY KEY,\n  flytype_kode   VARCHAR(20),\n  satt_i_drift   YEAR,\n  FOREIGN KEY (flytype_kode) REFERENCES flytyper(kode)\n);\nCREATE TABLE flyvninger (\n  nr       VARCHAR(10) PRIMARY KEY,\n  avgang   DATETIME NOT NULL,\n  ankomst  DATETIME NOT NULL,\n  fra_kode CHAR(3) NOT NULL,\n  til_kode CHAR(3) NOT NULL,\n  fly_reg  VARCHAR(10),\n  pris     DECIMAL(10,2) NOT NULL CHECK(pris >= 0),\n  status   ENUM('Planlagt','Boarding','Underveis','Landet','Kansellert') DEFAULT 'Planlagt',\n  FOREIGN KEY (fra_kode) REFERENCES flyplasser(kode),\n  FOREIGN KEY (til_kode) REFERENCES flyplasser(kode),\n  FOREIGN KEY (fly_reg)  REFERENCES fly(reg)\n);\nCREATE TABLE passasjerer (\n  id          INT AUTO_INCREMENT PRIMARY KEY,\n  fornavn     VARCHAR(100),\n  etternavn   VARCHAR(100),\n  pass_nr     VARCHAR(20) UNIQUE,\n  fødsel      DATE,\n  epost       VARCHAR(200)\n);\nCREATE TABLE bookinger (\n  id          INT AUTO_INCREMENT PRIMARY KEY,\n  ref_kode    CHAR(6) UNIQUE,\n  flyvning_nr VARCHAR(10) NOT NULL,\n  bestilt_dato DATETIME DEFAULT CURRENT_TIMESTAMP,\n  status      ENUM('Aktiv','Kansellert') DEFAULT 'Aktiv',\n  FOREIGN KEY (flyvning_nr) REFERENCES flyvninger(nr)\n);\nCREATE TABLE booking_passasjerer (\n  booking_id   INT,\n  passasjer_id INT,\n  sete         VARCHAR(5),\n  bagasje_kg   DECIMAL(5,2) DEFAULT 0,\n  PRIMARY KEY (booking_id, passasjer_id),\n  FOREIGN KEY (booking_id)   REFERENCES bookinger(id) ON DELETE CASCADE,\n  FOREIGN KEY (passasjer_id) REFERENCES passasjerer(id),\n  UNIQUE (booking_id, sete)\n);"},
{label:"Steg 4 · Komplett booking-spørring",code:"SELECT\n  b.ref_kode AS booking,\n  fv.nr AS flyvning,\n  fra.kode AS fra, fra.by AS fra_by,\n  til.kode AS til, til.by AS til_by,\n  fv.avgang, fv.ankomst,\n  ft.navn AS flytype,\n  CONCAT(p.fornavn,' ',p.etternavn) AS passasjer,\n  bp.sete, bp.bagasje_kg\nFROM bookinger b\nJOIN flyvninger fv          ON fv.nr = b.flyvning_nr\nJOIN flyplasser fra         ON fra.kode = fv.fra_kode\nJOIN flyplasser til         ON til.kode = fv.til_kode\nJOIN fly f                  ON f.reg = fv.fly_reg\nJOIN flytyper ft            ON ft.kode = f.flytype_kode\nJOIN booking_passasjerer bp ON bp.booking_id = b.id\nJOIN passasjerer p          ON p.id = bp.passasjer_id\nWHERE b.ref_kode = 'ABC123'\nORDER BY bp.sete;"},
{label:"Steg 5 · Belegg per flyvning",code:"SELECT\n  fv.nr,\n  fra.kode AS fra, til.kode AS til,\n  ft.kapasitet AS plasser,\n  COUNT(bp.passasjer_id) AS solgt,\n  ft.kapasitet - COUNT(bp.passasjer_id) AS ledig,\n  ROUND(COUNT(bp.passasjer_id) / ft.kapasitet * 100, 1) AS belegg_pst\nFROM flyvninger fv\nJOIN fly f         ON f.reg = fv.fly_reg\nJOIN flytyper ft   ON ft.kode = f.flytype_kode\nJOIN flyplasser fra ON fra.kode = fv.fra_kode\nJOIN flyplasser til ON til.kode = fv.til_kode\nLEFT JOIN bookinger b ON b.flyvning_nr = fv.nr AND b.status='Aktiv'\nLEFT JOIN booking_passasjerer bp ON bp.booking_id = b.id\nWHERE fv.avgang BETWEEN CURDATE() AND DATE_ADD(CURDATE(),INTERVAL 7 DAY)\nGROUP BY fv.nr, fra.kode, til.kode, ft.kapasitet\nORDER BY fv.avgang;"}
]}
];
const SYN={
  "join":["koble","kombinere","slå sammen"],"koble":["join"],"delete":["slett","fjern"],
  "slett":["delete"],"insert":["sett inn","legg til"],"update":["oppdater","endre"],
  "select":["hent","vis","velg"],"filter":["filtrer","where"],"group":["grupper"],
  "count":["tell","antall"],"sum":["summer","total"],"avg":["gjennomsnitt","snitt"],
  "rank":["ranger","rang"],"null":["tom","mangler"],"window":["vindu","over","partition"],
  "running":["løpende","kumulativ"],"normal":["normalisering","1nf","2nf","3nf"],
  "er":["er-modell","entitet","relasjon","diagram"],"operator":["operatorer","logisk","aritmetisk"],
  "struktur":["struktur","oppbygging","syntaks","anatomi"],"index":["indeks","ytelse"],
  "transaction":["transaksjon","commit","rollback"],"regexp":["regex","mønster"],
  "json":["json","dokument"],"date":["dato","tid"],"string":["streng","tekst"]
};
const CATS=[
  {id:"all",label:"Alle"},{id:"str",label:"📐 Struktur"},{id:"sel",label:"SELECT"},
  {id:"dml",label:"DML"},{id:"join",label:"JOIN"},{id:"agg",label:"Aggregat"},
  {id:"win",label:"Vindu"},{id:"cte",label:"CTE"},{id:"sub",label:"Delspørring"},
  {id:"ddl",label:"DDL"},{id:"idx",label:"Indeks"},{id:"txn",label:"Transaksjon"},
  {id:"op",label:"⚙ Operatorer"},{id:"fn",label:"Funksjoner"},
  {id:"nrm",label:"📊 Normalisering"},{id:"er",label:"🗂 ER-modell"}
];
const DM={beginner:{d:1,c:"var(--green)"},intermediate:{d:2,c:"var(--amber)"},advanced:{d:3,c:"var(--red)"}};

let activeCategory="all", activeDifficulty="all", activeEntry=null, searchTerm="";

function lev(a,b){if(!a.length)return b.length;if(!b.length)return a.length;
  const dp=Array.from({length:a.length+1},(_,i)=>[i]);
  for(let j=1;j<=b.length;j++)dp[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}
function fuz(t,txt){if(t.length<4)return false;
  return txt.split(/\s+/).some(w=>w.length>=t.length-1&&lev(t,w)<=1);
}
function expand(toks){const out=new Set(toks);
  for(const t of toks){(SYN[t]||[]).forEach(s=>s.split(/\s+/).forEach(w=>out.add(w)));}
  return [...out];
}
function score(e,q){if(!q)return 1;
  const ql=q.toLowerCase().trim(),raw=ql.split(/\s+/).filter(Boolean),tk=expand(raw);
  const cmd=e.cmd.toLowerCase(),desc=e.desc.toLowerCase(),
    tags=e.tags.join(' ').toLowerCase(),
    when=(e.when||[]).join(' ').toLowerCase(),
    cat=e.catLabel.toLowerCase(),
    code=(e.examples||[]).map(x=>x.code).join(' ').toLowerCase(),
    all=[cmd,desc,tags,when,cat,code].join(' ');
  let s=0;
  if(cmd.includes(ql))s+=20; if(tags.includes(ql))s+=15;
  if(desc.includes(ql))s+=10; if(all.includes(ql))s+=5;
  for(const t of raw){
    if(cmd.includes(t))s+=12; if(e.tags.some(x=>x.includes(t)))s+=8;
    if(desc.includes(t))s+=5; if(when.includes(t))s+=3;
    if(code.includes(t))s+=2; if(cat.includes(t))s+=2;
    if(fuz(t,cmd))s+=6; else if(fuz(t,tags))s+=4; else if(fuz(t,desc))s+=2;
  }
  for(const t of tk.filter(x=>!raw.includes(x))){
    if(cmd.includes(t))s+=4; if(e.tags.some(x=>x.includes(t)))s+=3;
    if(desc.includes(t))s+=2; if(all.includes(t))s+=1;
  }
  return s;
}
function isFuzzy(e,q){if(!q)return false;
  const raw=q.toLowerCase().trim().split(/\s+/).filter(Boolean),
    all=[e.cmd,e.desc,e.tags.join(' ')].join(' ').toLowerCase();
  return raw.every(t=>!all.includes(t)&&fuz(t,all));
}
function filter(){
  return DB.map(e=>({e,s:score(e,searchTerm)}))
    .filter(({e,s})=>{
      const cm=activeCategory==='all'||e.cat===activeCategory,
        dm=activeDifficulty==='all'||e.difficulty===activeDifficulty,
        sm=!searchTerm||s>0;
      return cm&&dm&&sm;
    }).sort((a,b)=>b.s-a.s).map(x=>x.e);
}
function highlight(t,q){if(!q)return t;
  const ts=[...new Set(q.toLowerCase().trim().split(/\s+/).filter(Boolean))];
  let r=t;
  for(const tk of ts){const esc=tk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    r=r.replace(new RegExp(`(${esc})`,'gi'),'<mark>$1</mark>');}
  return r;
}
function diffDots(d){const m=DM[d];if(!m)return '';
  let h='<div class="dd">';
  for(let i=1;i<=3;i++){
    h+=`<span class="ddot" style="background:${i<=m.d?m.c:'var(--bg4)'}"></span>`;
  }
  return h+'</div>';
}
function renderFilters(){
  const w=document.getElementById('filters');
  let h=CATS.map(c=>`<button class="fb${activeCategory===c.id?' act':''}" data-cat="${c.id}">${c.label}</button>`).join('');
  h+='<div class="fdiv"></div>';
  h+=[
    {id:'all',label:'Alle nivå',cls:''},
    {id:'beginner',label:'⬤ Nybegynner',cls:'d1'},
    {id:'intermediate',label:'⬤⬤ Mellomnivå',cls:'d2'},
    {id:'advanced',label:'⬤⬤⬤ Avansert',cls:'d3'}
  ].map(d=>`<button class="fb ${d.cls}${activeDifficulty===d.id?' act':''}" data-diff="${d.id}">${d.label}</button>`).join('');
  w.innerHTML=h;
  w.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    activeCategory=b.dataset.cat; renderFilters(); renderAll();
  }));
  w.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',()=>{
    activeDifficulty=b.dataset.diff; renderFilters(); renderAll();
  }));
}
function renderSidebar(es){
  const sb=document.getElementById('sidebar');
  const groups={};
  CATS.slice(1).forEach(c=>{groups[c.id]=[];});
  es.forEach(e=>{if(groups[e.cat])groups[e.cat].push(e);});
  let h='';
  for(const [cid,items] of Object.entries(groups)){
    if(!items.length)continue;
    const lbl=CATS.find(c=>c.id===cid)?.label||cid;
    h+=`<div class="sbs"><div class="sbt">${lbl}</div>`;
    for(const e of items){
      h+=`<div class="sbi${activeEntry===e.id?' act':''}" data-id="${e.id}">
        <span class="sbn">${e.cmd}</span>${diffDots(e.difficulty)}</div>`;
    }
    h+='</div>';
  }
  sb.innerHTML=h;
  sb.querySelectorAll('.sbi').forEach(it=>it.addEventListener('click',()=>{
    const el=document.querySelector(`.entry[data-id="${it.dataset.id}"]`);
    if(el){if(!el.classList.contains('exp'))el.classList.add('exp');
      el.scrollIntoView({behavior:'smooth',block:'start'});
      activeEntry=it.dataset.id;
      document.querySelectorAll('.sbi').forEach(s=>s.classList.toggle('act',s.dataset.id===activeEntry));}
  }));
}
function buildCode(c){
  const kws=['SELECT','FROM','WHERE','AND','OR','NOT','XOR','INSERT','INTO','VALUES','UPDATE','SET','DELETE','JOIN','INNER','LEFT','RIGHT','CROSS','ON','GROUP','BY','ORDER','HAVING','LIMIT','OFFSET','DISTINCT','AS','UNION','ALL','EXISTS','IN','BETWEEN','LIKE','RLIKE','REGEXP','IS','NULL','CASE','WHEN','THEN','ELSE','END','WITH','RECURSIVE','CREATE','TABLE','ALTER','DROP','ADD','COLUMN','INDEX','VIEW','TRUNCATE','BEGIN','COMMIT','ROLLBACK','START','TRANSACTION','SAVEPOINT','OVER','PARTITION','ROWS','RANGE','PRECEDING','FOLLOWING','UNBOUNDED','CURRENT','ROW','CONSTRAINT','PRIMARY','KEY','FOREIGN','REFERENCES','UNIQUE','CHECK','DEFAULT','AUTO_INCREMENT','INTERVAL','TEMPORARY','EXPLAIN','ANALYZE','CAST','BINARY','DESC','ASC','MODIFY','RENAME','TO','IGNORE','REPLACE','READ','ONLY','FOR','UPDATE','SHOW','VARIABLES','LIKE','USE','DATABASE','ENUM','TINYINT','INT','BIGINT','VARCHAR','TEXT','DATE','DATETIME','TIMESTAMP','DECIMAL','CHAR','YEAR','MONTH','DAY','HOUR','MINUTE','SECOND','BIT','MOD','DIV','RESTRICT','CASCADE','NO','ACTION','FULLTEXT','MATCH','AGAINST','BOOLEAN','MODE','GENERATED','VIRTUAL','STORED','ENGINE','InnoDB'];
  const fns=['COUNT','SUM','AVG','MIN','MAX','ROW_NUMBER','RANK','DENSE_RANK','NTILE','LAG','LEAD','FIRST_VALUE','LAST_VALUE','PERCENT_RANK','COALESCE','IFNULL','NULLIF','IF','CONCAT','CONCAT_WS','SUBSTRING','LENGTH','CHAR_LENGTH','UPPER','LOWER','TRIM','LTRIM','RTRIM','REPLACE','LEFT','RIGHT','LOCATE','POSITION','LPAD','RPAD','FORMAT','YEAR','MONTH','DAY','DATEDIFF','DATE_ADD','DATE_SUB','DATE_FORMAT','STR_TO_DATE','TIMESTAMPDIFF','EXTRACT','NOW','CURDATE','CURTIME','CURRENT_TIMESTAMP','ROUND','FLOOR','CEIL','CEILING','ABS','SQRT','POWER','POW','MOD','TRUNCATE','RAND','GREATEST','LEAST','SIGN','STDDEV','VARIANCE','BIT_COUNT','GROUPING','ROW_COUNT','LAST_INSERT_ID','VALUES','REGEXP_REPLACE','REGEXP_SUBSTR','JSON_EXTRACT','JSON_VALUE','JSON_UNQUOTE','JSON_OBJECT','JSON_ARRAY','QUARTER','ISNULL','UUID','MD5','SHA1','HEX','UNHEX','REPEAT','REVERSE','SPACE','UNIX_TIMESTAMP','FROM_UNIXTIME'];
  let r=c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/--[^\n]*/g,m=>`<span class="cmt">${m}</span>`)
    .replace(/'([^']*)'/g,'<span class="str">\'$1\'</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  fns.forEach(f=>{r=r.replace(new RegExp(`\\b(${f})(?=\\s*\\()`,'g'),'<span class="fn">$1</span>');});
  kws.forEach(k=>{r=r.replace(new RegExp(`\\b(${k})\\b`,'g'),'<span class="kw">$1</span>');});
  return r;
}
function renderEntries(es){
  const c=document.getElementById('content');
  if(!es.length){c.innerHTML='<div class="empty"><div class="ei">⊘</div><div class="et">Ingen resultater</div></div>';return;}
  let h='';
  for(const e of es){
    const fz=searchTerm&&isFuzzy(e,searchTerm);
    const rels=(e.related||[]).map(rid=>{const r=DB.find(x=>x.id===rid);
      return r?`<span class="relchip" data-goto="${rid}">${r.cmd}</span>`:'';}).join('');
    const pfs=(e.pitfalls||[]).map(p=>`<div class="pfitem"><span>⚠</span>${p}</div>`).join('');
    const stps=(e.steps||[]).map((s,i)=>`<div class="step"><div class="stepn">${i+1}</div><div class="stept">${s.s||s}</div></div>`).join('');
    h+=`<div class="entry" data-id="${e.id}"><div class="eh">
      <div class="el"><span class="badge cat-${e.cat}">${e.catLabel}</span></div>
      <div class="em"><div class="etitle">${highlight(e.cmd,searchTerm)}${diffDots(e.difficulty)}${fz?'<span class="fuzz">Fuzzy</span>':''}</div>
        <div class="edesc">${highlight(e.desc,searchTerm)}</div>
        <div class="etags">${e.tags.slice(0,6).map(t=>`<span class="tag">${highlight(t,searchTerm)}</span>`).join('')}</div></div>
      <span class="earr">▶</span></div>
      <div class="ebody">`;
    if(e.theory)h+=`<div class="es"><div class="esl">Teori</div><div class="theory">${e.theory}</div></div>`;
    if(stps)h+=`<div class="es"><div class="esl">Steg-for-steg</div><div class="steps">${stps}</div></div>`;
    if(e.when)h+=`<div class="es"><div class="esl">Når brukes det</div><div class="wl"><ul>${e.when.map(w=>`<li>${w}</li>`).join('')}</ul></div></div>`;
    if(e.examples&&e.examples.length){
      h+=`<div class="es"><div class="esl">Eksempler (${e.examples.length})</div>`;
      for(const ex of e.examples){h+=`<div class="exlbl">${ex.label}</div>
        <pre><button class="cpbtn" onclick="cp(this)">Kopier</button>${buildCode(ex.code)}</pre>`;}
      h+=`</div>`;
    }
    if(rels)h+=`<div class="es"><div class="esl">Relatert</div><div class="relwrap">${rels}</div></div>`;
    if(pfs)h+=`<div class="es"><div class="esl">Vanlige fallgruver</div><div class="pflist">${pfs}</div></div>`;
    if(e.note)h+=`<div class="es"><div class="notebox">💡 ${e.note}</div></div>`;
    h+=`</div></div>`;
  }
  c.innerHTML=h;
  c.querySelectorAll('.entry').forEach(card=>{
    card.querySelector('.eh').addEventListener('click',()=>{
      card.classList.toggle('exp');
      activeEntry=card.dataset.id;
      document.querySelectorAll('.sbi').forEach(s=>s.classList.toggle('act',s.dataset.id===activeEntry));
    });
  });
  c.querySelectorAll('.relchip').forEach(rc=>rc.addEventListener('click',ev=>{
    ev.stopPropagation();const rid=rc.dataset.goto;
    let t=document.querySelector(`.entry[data-id="${rid}"]`);
    if(!t){activeCategory='all';activeDifficulty='all';searchTerm='';
      document.getElementById('search').value='';renderFilters();renderAll();
      t=document.querySelector(`.entry[data-id="${rid}"]`);}
    if(t){t.classList.add('exp');t.scrollIntoView({behavior:'smooth',block:'start'});
      activeEntry=rid;
      document.querySelectorAll('.sbi').forEach(s=>s.classList.toggle('act',s.dataset.id===rid));}
  }));
}
function renderAll(){
  const es=filter();
  document.getElementById('count').textContent=`${es.length} ${es.length===1?'resultat':'resultater'}`;
  renderSidebar(es);renderEntries(es);
}
function cp(b){
  const code=b.parentElement.innerText.replace(/^Kopier\n?/,'');
  navigator.clipboard.writeText(code).then(()=>{
    b.textContent='Kopiert!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='Kopier';b.classList.remove('ok');},1500);
  });
}
const RK='mysql_recent';
function getRecent(){try{return JSON.parse(localStorage.getItem(RK)||'[]');}catch{return [];}}
function saveRecent(t){if(!t||t.length<2)return;
  let a=getRecent().filter(x=>x!==t);a.unshift(t);a=a.slice(0,6);
  try{localStorage.setItem(RK,JSON.stringify(a));}catch{}}
function renderRecent(){
  const a=getRecent(),w=document.getElementById('rw'),c=document.getElementById('rchips');
  if(!a.length){w.classList.remove('vis');return;}
  w.classList.add('vis');
  c.innerHTML=a.map(t=>`<span class="rchip" data-term="${t}">${t}</span>`).join('');
  c.querySelectorAll('.rchip').forEach(ch=>ch.addEventListener('click',()=>{
    searchTerm=ch.dataset.term;document.getElementById('search').value=searchTerm;renderAll();
  }));
}
document.getElementById('rclear').addEventListener('click',()=>{
  try{localStorage.removeItem(RK);}catch{}renderRecent();
});
document.querySelectorAll('.tip').forEach(t=>{
  const term=t.querySelector('span')?.textContent?.replace(/«|»/g,'').trim();
  if(term)t.addEventListener('click',()=>{
    searchTerm=term;document.getElementById('search').value=term;renderAll();
    document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'});
  });
});
let st;
document.getElementById('search').addEventListener('input',e=>{
  searchTerm=e.target.value.trim();renderAll();
  clearTimeout(st);st=setTimeout(()=>{if(searchTerm)saveRecent(searchTerm);},1200);
});
document.getElementById('search').addEventListener('focus',renderRecent);
document.addEventListener('keydown',e=>{
  const s=document.getElementById('search');
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();s.focus();s.select();}
  if(e.key==='Escape'&&document.activeElement===s){
    if(searchTerm){searchTerm='';s.value='';renderAll();}else{s.blur();}
  }
});
renderFilters();renderAll();renderRecent();
</script></body></html>
