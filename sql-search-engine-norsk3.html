<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:14px 22px 0;position:sticky;top:0;z-index:100}

.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#e67e22,#c0392b);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;letter-spacing:-.5px}
.logo-text{font-size:15px;font-weight:600}
.logo-sub{font-size:11px;color:var(--text3)}
.sw{flex:1;position:relative}
.si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.kh{position:absolute;right:11px;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.kbd{background:var(--bg4);border:1px solid var(--border2);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--text3);font-family:var(--mono)}
#search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:9px;padding:9px 76px 9px 38px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
#search::placeholder{color:var(--text3)}
#search:focus{border-color:var(--accent)}
.rc{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.rw{display:none;padding:3px 0 8px;align-items:center;gap:5px;flex-wrap:wrap}
.rw.vis{display:flex}
.rl{font-size:11px;color:var(--text3)}
.rchip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .12s}
.rchip:hover{border-color:var(--accent);color:var(--accent)}
.rclear{font-size:10px;color:var(--text3);cursor:pointer;margin-left:2px}
.rclear:hover{color:var(--red)}
.fr{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;flex-wrap:wrap}
.fr::-webkit-scrollbar{display:none}
.fdiv{width:1px;height:16px;background:var(--border2);flex-shrink:0;margin:0 2px;align-self:center}
.fb{background:transparent;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .12s;font-family:var(--font)}
.fb:hover{border-color:var(--border2);color:var(--text)}
.fb.act{background:var(--accent);border-color:var(--accent);color:#fff}
.fb.d1{color:var(--green);border-color:rgba(59,207,154,.3)}.fb.d1.act{background:#1a5c40;border-color:var(--green);color:#fff}
.fb.d2{color:var(--amber);border-color:rgba(247,201,72,.3)}.fb.d2.act{background:#5c4a10;border-color:var(--amber);color:#fff}
.fb.d3{color:var(--red);border-color:rgba(240,112,112,.3)}.fb.d3.act{background:#5c1010;border-color:var(--red);color:#fff}
.tips{background:var(--bg3);border-bottom:1px solid var(--border);padding:6px 22px;font-size:11px;color:var(--text3);display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.tips::-webkit-scrollbar{display:none}
.tip{white-space:nowrap;cursor:pointer}.tip:hover span{color:var(--accent)}.tip span{color:var(--text2);transition:color .1s}
.main{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 146px)}
.sb{border-right:1px solid var(--border);padding:10px 0;overflow-y:auto;max-height:calc(100vh - 146px);position:sticky;top:146px}
.sbs{margin-bottom:2px}
.sbt{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:7px 16px 3px}
.sbi{padding:5px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .1s;border-left:2px solid transparent}
.sbi:hover{background:var(--bg3)}.sbi.act{background:var(--bg3);border-left-color:var(--accent)}
.sbn{font-family:var(--mono);font-size:11.5px;color:var(--text2)}.sbi.act .sbn{color:var(--accent)}
.sbd{display:flex;gap:2px}.sbdot{width:5px;height:5px;border-radius:50%}
.ct{padding:18px 26px}
.entry{background:var(--bg2);border:1px solid var(--border);border-radius:11px;margin-bottom:12px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.entry:hover{border-color:var(--border2)}.entry.exp{border-color:var(--accent)}
.eh{padding:13px 16px;display:flex;align-items:flex-start;gap:11px;user-select:none}
.el{flex-shrink:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-top:1px}
.badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:3px 7px;border-radius:5px;white-space:nowrap}
.dd{display:flex;gap:2px}.ddot{width:6px;height:6px;border-radius:50%}
.em{flex:1;min-width:0}
.etitle{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px}
.edesc{font-size:13px;color:var(--text2);line-height:1.5}
.etags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:11px;background:var(--bg4);color:var(--text3);border-radius:3px;padding:2px 6px}
.earr{color:var(--text3);font-size:12px;flex-shrink:0;margin-top:3px;transition:transform .15s}
.entry.exp .earr{transform:rotate(90deg)}
.ebody{display:none;border-top:1px solid var(--border)}.entry.exp .ebody{display:block}
.es{padding:13px 16px;border-bottom:1px solid var(--border)}.es:last-child{border-bottom:none}
.esl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:7px}
.wl{font-size:13px;color:var(--text2);line-height:1.6}.wl li{margin-left:15px;margin-bottom:2px}
pre{background:var(--code);border:1px solid var(--border);border-radius:7px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;color:var(--text);margin-bottom:5px;position:relative}
pre:last-child{margin-bottom:0}
.exlbl{font-size:11px;color:var(--text3);margin:9px 0 2px}
.cpbtn{position:absolute;top:7px;right:7px;background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--text3);cursor:pointer;font-family:var(--font);transition:all .1s}
.cpbtn:hover{color:var(--text);border-color:var(--accent)}.cpbtn.ok{color:var(--green);border-color:var(--green)}
.kw{color:#79b8ff}.fn{color:#b392f0}.str{color:#9ecbff}.num{color:#f8c555}.cmt{color:#4a5568;font-style:italic}
.relwrap{display:flex;flex-wrap:wrap;gap:5px}
.relchip{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:3px 8px;font-size:11px;color:#7aabff;cursor:pointer;font-family:var(--mono);transition:all .12s}
.relchip:hover{border-color:var(--accent);color:var(--accent)}
.pflist{display:flex;flex-direction:column;gap:4px}
.pfitem{background:rgba(240,112,112,.08);border:1px solid rgba(240,112,112,.2);border-radius:5px;padding:7px 10px;font-size:12.5px;color:var(--red);display:flex;gap:7px}
.notebox{background:rgba(247,201,72,.08);border:1px solid rgba(247,201,72,.2);border-radius:5px;padding:8px 12px;font-size:12.5px;color:var(--amber);line-height:1.5}
.theory{font-size:13px;color:var(--text2);line-height:1.7}
.theory h4{color:var(--text);font-size:13px;font-weight:600;margin:11px 0 5px}
.theory p{margin-bottom:8px}.theory ul{margin-left:17px;margin-bottom:8px}.theory li{margin-bottom:3px}
.theory .fm{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:7px 12px;font-family:var(--mono);font-size:12px;color:var(--accent);margin:7px 0}
.theory strong{color:var(--text)}.theory .ok{color:var(--green)}.theory .bad{color:var(--red)}
.theory table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono);margin:8px 0}
.theory th{background:var(--bg3);padding:6px 10px;text-align:left;border:1px solid var(--border2);color:var(--text)}
.theory td{padding:5px 10px;border:1px solid var(--border2)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:flex-start}
.stepn{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.stept{font-size:13px;color:var(--text2);line-height:1.5;flex:1}.stept strong{color:var(--text)}
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.ei{font-size:28px;margin-bottom:11px}.et{font-size:15px;color:var(--text2);margin-bottom:5px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
mark{background:rgba(79,142,247,.28);color:var(--accent);border-radius:2px;padding:0 1px}
.fuzz{font-size:10px;background:rgba(247,201,72,.1);color:var(--amber);border-radius:3px;padding:1px 5px;margin-left:5px}
.cat-str{background:rgba(80,200,240,.12);color:#50c8f0}
.cat-sel{background:rgba(79,142,247,.12);color:#7aabff}
.cat-dml{background:rgba(59,207,154,.1);color:var(--green)}
.cat-join{background:rgba(160,80,240,.12);color:var(--purple)}
.cat-agg{background:rgba(240,100,180,.12);color:#f070c0}
.cat-win{background:rgba(80,200,240,.12);color:#50c8f0}
.cat-cte{background:rgba(80,180,100,.12);color:#50c870}
.cat-sub{background:rgba(100,80,240,.12);color:#9080f0}
.cat-ddl{background:rgba(247,201,72,.1);color:var(--amber)}
.cat-idx{background:rgba(180,140,80,.12);color:#d4aa50}
.cat-txn{background:rgba(240,80,80,.1);color:var(--red)}
.cat-op{background:rgba(200,120,40,.12);color:#e0944a}
.cat-nrm{background:rgba(40,160,200,.12);color:#50b8d8}
.cat-er{background:rgba(120,80,200,.12);color:#a070d8}
.cat-fn{background:rgba(120,120,120,.12);color:#909090}
</style></head><body>

<script>

const DB=[
{id:"sql-struktur",cmd:"SELECT — Spørringsstruktur",cat:"str",catLabel:"STRUKTUR",
desc:"Komplett anatomi for en MySQL SELECT-setning. Klausulrekkefølgen er obligatorisk.",
tags:["struktur","oppbygging","syntaks","klausuler","anatomi","mal","rekkefølge","query"],
difficulty:"beginner",related:["utforelse","where","group-by","order-by","limit-offset"],
pitfalls:["Klausulene MÅ stå i denne rekkefølgen — ORDER BY alltid etter GROUP BY/HAVING.","SELECT-aliaser kan IKKE brukes i WHERE (SELECT kjøres etter WHERE).","MySQL tillater alias i ORDER BY som unntak."],
when:["Komplett mal:","SELECT [DISTINCT]   kol1, kol2, AGG(kol3) AS alias","FROM                tabell1 [AS t1]","[INNER|LEFT|RIGHT] JOIN tabell2 ON betingelse","WHERE               rad-betingelse","GROUP BY            kol1, kol2","HAVING              gruppe-betingelse","ORDER BY            kol1 [ASC|DESC]","LIMIT               antall [OFFSET start];"],
examples:[
{label:"1 · Minimum — alle rader",code:"SELECT * FROM employees;"},
{label:"2 · Bestemte kolonner",code:"SELECT name, salary, department\nFROM employees;"},
{label:"3 · Med alias",code:"SELECT name AS navn, salary AS lønn\nFROM employees;"},
{label:"4 · WHERE-filter",code:"SELECT name, salary\nFROM employees\nWHERE department = 'IT';"},
{label:"5 · Sortering og grense",code:"SELECT name, salary\nFROM employees\nORDER BY salary DESC\nLIMIT 10;"},
{label:"6 · GROUP BY + aggregat",code:"SELECT department, COUNT(*) AS ant, AVG(salary) AS snitt\nFROM employees\nGROUP BY department;"},
{label:"7 · HAVING for grupper",code:"SELECT department, COUNT(*) AS ant\nFROM employees\nGROUP BY department\nHAVING ant > 3;"},
{label:"8 · INNER JOIN",code:"SELECT e.name, d.dept_name\nFROM employees e\nINNER JOIN departments d ON e.dept_id = d.id\nWHERE e.salary > 50000;"},
{label:"9 · LEFT JOIN + GROUP BY + HAVING",code:"SELECT d.dept_name, COUNT(e.id) AS ant, AVG(e.salary) AS snitt\nFROM departments d\nLEFT JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name\nHAVING ant > 0\nORDER BY snitt DESC\nLIMIT 10;"},
{label:"10 · Subquery + CTE + vindufunksjon",code:"WITH avd_snitt AS (\n  SELECT dept_id, AVG(salary) AS snitt\n  FROM employees GROUP BY dept_id\n)\nSELECT e.name, e.salary, a.snitt,\n  RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS rang\nFROM employees e\nJOIN avd_snitt a ON e.dept_id = a.dept_id\nWHERE e.salary > a.snitt\nORDER BY rang;"}
]},
{id:"utforelse",cmd:"SQL Utførelsesrekkefølge",cat:"str",catLabel:"STRUKTUR",
desc:"MySQL utfører IKKE en SELECT i skriverekkefølgen. Forstå den faktiske rekkefølgen.",
tags:["utførelse","rekkefølge","eksekusjon","alias","feilmelding"],
difficulty:"beginner",related:["sql-struktur","where","group-by"],
theory:"<h4>Faktisk eksekusjonsrekkefølge i MySQL</h4><div class='fm'>① FROM &amp; JOIN → ② WHERE → ③ GROUP BY → ④ HAVING → ⑤ SELECT → ⑥ DISTINCT → ⑦ ORDER BY → ⑧ LIMIT/OFFSET</div><h4>Konsekvenser:</h4><ul><li><strong>FROM/JOIN</strong> kjøres FØRST</li><li><strong>WHERE</strong> kan IKKE bruke aggregater</li><li><strong>HAVING</strong> KAN bruke aggregater</li><li><strong>ORDER BY</strong> kan bruke alias i MySQL (utvidelse)</li><li><strong>LIMIT</strong> kjøres absolutt sist</li></ul>",
pitfalls:["Alias i WHERE → ERROR.","Aggregater i WHERE → ERROR. Bruk HAVING."],
when:["① FROM/JOIN","② WHERE — radfilter","③ GROUP BY","④ HAVING — gruppefilter (aggregater OK)","⑤ SELECT","⑥ DISTINCT","⑦ ORDER BY (alias OK)","⑧ LIMIT/OFFSET"],
examples:[
{label:"1 · Alias i WHERE — FEIL",code:"-- ❌ FEIL\nSELECT name, salary*12 AS årslønn\nFROM employees\nWHERE årslønn > 600000;  -- ERROR: Unknown column"},
{label:"2 · Korrekt: original kolonne",code:"SELECT name, salary*12 AS årslønn\nFROM employees\nWHERE salary*12 > 600000;"},
{label:"3 · Aggregat i WHERE — FEIL",code:"-- ❌ FEIL\nSELECT department, COUNT(*)\nFROM employees\nWHERE COUNT(*) > 3;  -- ERROR"},
{label:"4 · Korrekt: HAVING",code:"SELECT department, COUNT(*) AS ant\nFROM employees\nGROUP BY department\nHAVING ant > 3;"},
{label:"5 · ORDER BY kan bruke alias (MySQL)",code:"SELECT name, salary*12 AS årslønn\nFROM employees\nORDER BY årslønn DESC;"},
{label:"6 · WHERE filtrerer FØR GROUP BY",code:"SELECT department, COUNT(*) AS ant\nFROM employees\nWHERE hire_date >= '2020-01-01'  -- ② FØR gruppering\nGROUP BY department\nHAVING ant > 2;                 -- ④ ETTER gruppering"},
{label:"7 · LIMIT kjøres absolutt sist",code:"SELECT d.dept_name, COUNT(e.id) AS ant\nFROM departments d\nJOIN employees e ON e.dept_id = d.id\nWHERE e.salary > 50000\nGROUP BY d.dept_name\nHAVING ant > 1\nORDER BY ant DESC\nLIMIT 3;  -- kun 3 rader til slutt"},
{label:"8 · DISTINCT etter SELECT",code:"SELECT DISTINCT department\nFROM employees\nORDER BY department;"},
{label:"9 · JOIN er del av FROM-fasen",code:"SELECT e.name, d.dept_name\nFROM employees e\nJOIN departments d ON e.dept_id = d.id  -- ① del av FROM\nWHERE e.salary > 60000;                   -- ② etter JOIN"},
{label:"10 · Full demonstrasjon",code:"SELECT                              -- ⑤\n  d.dept_name,\n  COUNT(DISTINCT e.id) AS ant,       -- ⑥ DISTINCT\n  AVG(e.salary) AS snitt\nFROM departments d                   -- ①\nLEFT JOIN employees e ON e.dept_id=d.id  -- ①\nWHERE e.hire_date >= '2020-01-01'   -- ②\nGROUP BY d.dept_name                -- ③\nHAVING snitt > 55000                -- ④\nORDER BY ant DESC                   -- ⑦\nLIMIT 5;                            -- ⑧"}
]},
{id:"select-cmd",cmd:"SELECT",cat:"sel",catLabel:"SELECT",

{label:"9 · JOIN to tabeller",code:"SELECT e.name, d.dept_name, e.salary\nFROM employees e\nJOIN departments d ON e.dept_id = d.id\nORDER BY d.dept_name, e.salary DESC;"},
{label:"10 · Med subquery",code:"SELECT name, salary,\n  ROUND((salary/(SELECT AVG(salary) FROM employees))*100,1) AS pst_av_snitt\nFROM employees\nORDER BY pst_av_snitt DESC;"},
{label:"11 · CASE for klassifisering",code:"SELECT name, salary,\n  CASE\n    WHEN salary >= 80000 THEN '🔴 Senior'\n    WHEN salary >= 55000 THEN '🟡 Mellom'\n    ELSE '🟢 Junior'\n  END AS nivå\nFROM employees\nORDER BY salary DESC;"}
]},
{id:"distinct",cmd:"DISTINCT",cat:"sel",catLabel:"SELECT",

{id:"where",cmd:"WHERE",cat:"sel",catLabel:"SELECT",
desc:"Filtrer rader basert på betingelser FØR gruppering.",
tags:["where","filtrer","betingelse","kriterier"],
difficulty:"beginner",related:["select-cmd","having","between","like","in-list","null-check"],
pitfalls:["WHERE kjøres FØR GROUP BY — aggregater er IKKE tillatt.","NULL = noe → FALSE alltid. Bruk IS NULL.","Alias fra SELECT er IKKE tilgjengelig i WHERE."],
when:["Filtrer rader FØR GROUP BY","Kombinér med AND/OR","NULL-sjekk med IS NULL"],
examples:[
{label:"1 · Enkel lik",code:"SELECT * FROM employees WHERE department = 'IT';"},
{label:"2 · Numerisk",code:"SELECT * FROM employees WHERE salary > 60000;"},
{label:"3 · AND",code:"SELECT name, salary FROM employees\nWHERE department = 'IT' AND salary > 60000;"},
{label:"4 · OR",code:"SELECT name FROM employees\nWHERE department = 'IT' OR department = 'HR';"},
{label:"5 · NOT",code:"SELECT * FROM employees WHERE NOT department = 'HR';"},
{label:"6 · Parenteser styrer logikk",code:"SELECT * FROM employees\nWHERE (department='IT' OR department='Engineering')\n  AND salary BETWEEN 50000 AND 90000;"},
{label:"7 · Dato-filter",code:"SELECT * FROM orders\nWHERE order_date >= '2024-01-01'\n  AND order_date < '2025-01-01';"},
{label:"8 · LIKE i WHERE",code:"SELECT * FROM customers\nWHERE email LIKE '%@gmail.com' AND city = 'Oslo';"},
{label:"9 · Subquery i WHERE",code:"SELECT name, salary FROM employees\nWHERE dept_id IN (SELECT id FROM departments WHERE location='Oslo');"},
{label:"10 · Kombinert flerfelts-filter",code:"SELECT name, salary, manager_id FROM employees\nWHERE salary > 50000\n  AND hire_date >= '2020-01-01'\n  AND manager_id IS NOT NULL\n  AND department != 'Ledelse'\nORDER BY salary DESC;"}
]},
{id:"order-by",cmd:"ORDER BY",cat:"sel",catLabel:"SELECT",
desc:"Sorter resultatsettet etter én eller flere kolonner.",
tags:["order by","sorter","stigende","synkende","asc","desc","field"],
difficulty:"beginner",related:["select-cmd","limit-offset","row-number"],
pitfalls:["Uten ORDER BY er rekkefølgen UDEFINERT."],
when:["Sorter output","Topp-N-lister","Egendefinert rekkefølge med FIELD()"],
examples:[
{label:"1 · Stigende (standard)",code:"SELECT name, salary FROM employees ORDER BY salary;"},
{label:"2 · Synkende",code:"SELECT name, salary FROM employees ORDER BY salary DESC;"},
{label:"3 · Alfabetisk",code:"SELECT name FROM employees ORDER BY name ASC;"},
{label:"4 · To kolonner",code:"SELECT name, department, salary\nFROM employees ORDER BY department ASC, salary DESC;"},
{label:"5 · Kolonnenummer",code:"SELECT name, department, salary\nFROM employees ORDER BY 2, 3 DESC;"},
{label:"6 · Alias (MySQL-utvidelse)",code:"SELECT name, salary*12 AS årslønn\nFROM employees ORDER BY årslønn DESC;"},
{label:"7 · Beregnet uttrykk",code:"SELECT name, hire_date,\n  DATEDIFF(CURDATE(), hire_date) AS dager\nFROM employees ORDER BY dager DESC;"},
{label:"8 · NULL sist",code:"SELECT name, manager_id FROM employees\nORDER BY manager_id IS NULL, manager_id;"},
{label:"9 · FIELD() — egendefinert",code:"SELECT name, status FROM tasks\nORDER BY FIELD(status,'Kritisk','Høy','Normal','Lav');"},
{label:"10 · ORDER BY med vindufunksjon",code:"SELECT * FROM (\n  SELECT name, department, salary,\n    ROW_NUMBER() OVER(PARTITION BY department ORDER BY salary DESC) AS rn\n  FROM employees\n) t WHERE rn <= 3 ORDER BY department, salary DESC;"}
]},
{id:"limit-offset",cmd:"LIMIT / OFFSET",cat:"sel",catLabel:"SELECT",
desc:"Begrens antall returnerte rader og implementer paginering.",
tags:["limit","offset","paginering","top n","grense","side"],
difficulty:"beginner",related:["select-cmd","order-by","row-number"],
pitfalls:["Alltid bruk ORDER BY med LIMIT.","Høy OFFSET er treg — bruk cursor-basert paginering."],
when:["Hent N første","Paginering","Cursor-basert navigering"],
examples:[
{label:"1 · Første 5",code:"SELECT * FROM employees LIMIT 5;"},
{label:"2 · Hopp over og hent",code:"SELECT * FROM employees ORDER BY id LIMIT 5 OFFSET 10;"},
{label:"3 · Side 1 (10 per side)",code:"SELECT * FROM products ORDER BY name LIMIT 10 OFFSET 0;"},
{label:"4 · Side 2",code:"SELECT * FROM products ORDER BY name LIMIT 10 OFFSET 10;"},
{label:"5 · Side N (dynamisk)",code:"-- side=3, per_side=10 → OFFSET = (3-1)*10 = 20\nSELECT * FROM products ORDER BY name LIMIT 10 OFFSET 20;"},
{label:"6 · Dyreste produkt",code:"SELECT name, price FROM products ORDER BY price DESC LIMIT 1;"},
{label:"7 · Nest dyreste",code:"SELECT name, price FROM products\nORDER BY price DESC LIMIT 1 OFFSET 1;"},
{label:"8 · Topp 10 kunder etter omsetning",code:"SELECT customer_id, SUM(amount) AS total\nFROM orders GROUP BY customer_id\nORDER BY total DESC LIMIT 10;"},
{label:"9 · Alternativ MySQL-syntaks",code:"SELECT * FROM employees LIMIT 10, 5;\n-- Ekvivalent: LIMIT 5 OFFSET 10"},
{label:"10 · Cursor-basert paginering",code:"-- Side 1\nSELECT id, name FROM employees\nWHERE id > 0 ORDER BY id LIMIT 20;\n-- Neste side (last_id=20)\nSELECT id, name FROM employees\nWHERE id > 20 ORDER BY id LIMIT 20;  -- raskere enn OFFSET"}
]},
{id:"like",cmd:"LIKE / NOT LIKE",cat:"sel",catLabel:"SELECT",
desc:"Tekstmønstergjenkjenning med jokertegnene % (mange tegn) og _ (ett tegn).",
tags:["like","mønster","wildcard","prefix","suffix","inneholder","binary"],
difficulty:"beginner",related:["where","regexp","string-fn"],
pitfalls:["LIKE '%søk%' bruker IKKE indeks.","MySQL LIKE er case-insensitivt som standard."],
when:["Enkle tekstmønstre","Prefix-/suffix-søk","Inneholdssjekk"],
examples:[
{label:"1 · Starter med",code:"SELECT * FROM employees WHERE name LIKE 'A%';"},
{label:"2 · Slutter med",code:"SELECT * FROM employees WHERE name LIKE '%sen';"},
{label:"3 · Inneholder",code:"SELECT * FROM products WHERE description LIKE '%trådløs%';"},
{label:"4 · Ett tegn med _",code:"SELECT * FROM codes WHERE code LIKE 'A_1';\n-- Treffer A01, AB1, AC1, men ikke A001"},
{label:"5 · NOT LIKE",code:"SELECT * FROM emails WHERE address NOT LIKE '%@spam%';"},
{label:"6 · E-poster fra domene",code:"SELECT name, email FROM users\nWHERE email LIKE '%@oslo.kommune.no';"},
{label:"7 · Postnummer Oslo",code:"SELECT * FROM addresses WHERE zip LIKE '02%';"},
{label:"8 · LIKE + AND",code:"SELECT * FROM customers\nWHERE name LIKE 'A%' AND city LIKE 'Ber%';"},
{label:"9 · Case-sensitivt LIKE",code:"-- BINARY tvinger case-sensitiv sammenligning\nSELECT * FROM products WHERE name LIKE BINARY '%iPhone%';\n-- Treffer 'iPhone' men ikke 'IPHONE' eller 'iphone'"},
{label:"10 · Kombinert LIKE i JOIN",code:"SELECT c.name, o.id FROM customers c\nJOIN orders o ON o.customer_id = c.id\nWHERE c.name LIKE '%Hansen%'\n  AND o.order_date >= '2024-01-01';"}
]},
{id:"between",cmd:"BETWEEN / NOT BETWEEN",cat:"sel",catLabel:"SELECT",
desc:"Filtrer verdier innenfor et inkluderende intervall (tall, datoer, tekst).",
tags:["between","intervall","mellom","range","datoperiode"],
difficulty:"beginner",related:["where","in-list","date-fn"],
pitfalls:["BETWEEN er inkluderende i BEGGE ender.","For datoer med klokkeslett: bruk >= og < i stedet."],
when:["Tall-/dato-/tekstintervall","Erstatt >= AND <="],
examples:[
{label:"1 · Tallintervall",code:"SELECT * FROM employees\nWHERE salary BETWEEN 50000 AND 80000;"},
{label:"2 · Datointervall",code:"SELECT * FROM orders\nWHERE order_date BETWEEN '2024-01-01' AND '2024-12-31';"},
{label:"3 · NOT BETWEEN",code:"SELECT * FROM products\nWHERE price NOT BETWEEN 100 AND 500;"},
{label:"4 · Inklusiv test",code:"-- Inkluderer både 1 og 5\nSELECT * FROM scores WHERE points BETWEEN 1 AND 5;"},
{label:"5 · Sikrere dato med klokkeslett",code:"SELECT * FROM orders\nWHERE order_date >= '2024-01-01'\n  AND order_date < '2025-01-01';"},
{label:"6 · Tekst alfabetisk",code:"SELECT * FROM employees\nWHERE name BETWEEN 'A' AND 'M';"},
{label:"7 · Alder",code:"SELECT name, age FROM customers\nWHERE age BETWEEN 18 AND 35;"},
{label:"8 · CASE med BETWEEN",code:"SELECT name,\n  CASE\n    WHEN salary BETWEEN 0 AND 39999     THEN 'Under 40k'\n    WHEN salary BETWEEN 40000 AND 69999 THEN '40k–70k'\n    ELSE '70k+'\n  END AS bånd\nFROM employees;"},
{label:"9 · Dato + beløp",code:"SELECT * FROM orders\nWHERE order_date BETWEEN '2024-01-01' AND '2024-06-30'\n  AND amount BETWEEN 500 AND 10000;"},
{label:"10 · Siste 30 dager",code:"SELECT * FROM events\nWHERE event_date BETWEEN\n  DATE_SUB(CURDATE(), INTERVAL 30 DAY) AND CURDATE();"}
]},
{id:"in-list",cmd:"IN / NOT IN",cat:"sel",catLabel:"SELECT",
desc:"Filtrer mot en liste med verdier — raskere enn mange OR.",
tags:["in","not in","liste","verdimatching","or-erstatning"],
difficulty:"beginner",related:["where","exists","between","subquery"],
pitfalls:["NOT IN returnerer INGENTING om listen inneholder NULL — bruk NOT EXISTS.","Lange IN-lister kan bli trege."],
when:["Match mot statisk liste","Erstatt mange OR","Filter fra subquery"],
examples:[
{label:"1 · Statisk liste",code:"SELECT * FROM employees\nWHERE department IN ('IT','Finance','HR');"},
{label:"2 · NOT IN",code:"SELECT * FROM products\nWHERE category NOT IN ('Arkivert','Utkast');"},
{label:"3 · IN med tall",code:"SELECT * FROM orders WHERE status_id IN (1,2,5);"},
{label:"4 · IN med subquery",code:"SELECT * FROM employees\nWHERE dept_id IN (\n  SELECT id FROM departments WHERE location='Oslo'\n);"},
{label:"5 · NOT IN med subquery",code:"SELECT name FROM customers\nWHERE id NOT IN (SELECT DISTINCT customer_id FROM orders);"},
{label:"6 · IN + dato",code:"SELECT * FROM sales\nWHERE product_id IN (101,205,307)\n  AND sale_date >= '2024-01-01';"},
{label:"7 · IN i UPDATE",code:"UPDATE employees SET department='Engineering'\nWHERE id IN (12,17,23,45);"},
{label:"8 · IN i DELETE",code:"DELETE FROM sessions\nWHERE user_id IN (SELECT id FROM users WHERE active=0);"},
{label:"9 · Sikker NOT EXISTS-alternativ",code:"-- Tryggere enn NOT IN når subquery kan returnere NULL:\nSELECT name FROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id\n);"},
{label:"10 · IN med JOIN (ytelse)",code:"SELECT e.* FROM employees e\nINNER JOIN (\n  SELECT id FROM departments WHERE budget > 1000000\n) d ON e.dept_id = d.id;"}
]},
{id:"null-check",cmd:"IS NULL / IS NOT NULL",cat:"sel",catLabel:"SELECT",
desc:"Sjekk om en verdi er NULL — manglende eller ukjent data.",
tags:["null","is null","is not null","manglende","coalesce","ifnull","null-sikker"],
difficulty:"beginner",related:["where","coalesce","left-join"],
pitfalls:["= NULL er alltid FALSE.","NULL i aritmetikk smitter: 5+NULL=NULL."],
when:["Finn manglende data","Ekskluder NULL","NULL-sikker sammenligning med <=>"],
examples:[
{label:"1 · Finn rader uten leder",code:"SELECT * FROM employees WHERE manager_id IS NULL;"},
{label:"2 · Finn rader med telefon",code:"SELECT name, phone FROM employees WHERE phone IS NOT NULL;"},
{label:"3 · Tell NULL vs ikke-NULL",code:"SELECT\n  COUNT(*) AS totalt,\n  COUNT(manager_id) AS med_leder,\n  COUNT(*)-COUNT(manager_id) AS uten\nFROM employees;"},
{label:"4 · COALESCE",code:"SELECT name, COALESCE(phone,'Ingen tlf') AS kontakt\nFROM employees;"},
{label:"5 · IFNULL (MySQL-spesifikk)",code:"SELECT name, IFNULL(bonus, 0) AS bonus FROM employees;"},
{label:"6 · NULL i WHERE med AND",code:"SELECT * FROM orders\nWHERE shipped_date IS NULL\n  AND order_date < DATE_SUB(CURDATE(), INTERVAL 7 DAY);"},
{label:"7 · NULLIF — unngå divisjon med 0",code:"SELECT name, total/NULLIF(antall, 0) AS snitt\nFROM rapport;"},
{label:"8 · Mange NULL-felt",code:"SELECT id, name FROM customers\nWHERE phone IS NULL AND email IS NULL AND address IS NULL;"},
{label:"9 · LEFT JOIN + IS NULL (anti-join)",code:"SELECT c.name FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;  -- kunder uten bestillinger"},
{label:"10 · NULL-sikker <=> i MySQL",code:"-- <=> er NULL-sikker lik (MySQL-spesifikk)\nSELECT * FROM employees WHERE manager_id <=> NULL;\n-- Ekvivalent med: WHERE manager_id IS NULL\n\n-- Nyttig i JOIN:\nSELECT a.name, b.name FROM emp a JOIN emp b\n  ON a.manager_id <=> b.manager_id;"}
]},
{id:"case-when",cmd:"CASE WHEN",cat:"sel",catLabel:"SELECT",
desc:"Betinget logikk — tilsvarer if/else/switch.",
tags:["case","when","then","else","betinget","if-else","klassifiser","pivot"],
difficulty:"intermediate",related:["coalesce","group-by","rollup"],
pitfalls:["Manglende ELSE returnerer NULL.","CASE evaluerer top-til-bunn og stopper ved første treff."],
when:["Klassifiser data","Betingede beregninger","Pivot-teknikk","Egendefinert sortering"],
examples:[
{label:"1 · Enkel verdisjekk",code:"SELECT name,\n  CASE status\n    WHEN 1 THEN 'Aktiv'\n    WHEN 0 THEN 'Inaktiv'\n    ELSE 'Ukjent'\n  END AS status_tekst\nFROM employees;"},
{label:"2 · Søkt CASE",code:"SELECT name, salary,\n  CASE\n    WHEN salary >= 80000 THEN 'Senior'\n    WHEN salary >= 55000 THEN 'Mellom'\n    ELSE 'Junior'\n  END AS nivå\nFROM employees;"},
{label:"3 · CASE i ORDER BY",code:"SELECT name, status FROM tasks\nORDER BY CASE status\n  WHEN 'Kritisk' THEN 1 WHEN 'Høy' THEN 2\n  WHEN 'Normal' THEN 3 ELSE 4 END;"},
{label:"4 · CASE i aggregat",code:"SELECT department,\n  SUM(CASE WHEN salary >= 70000 THEN 1 ELSE 0 END) AS høy,\n  SUM(CASE WHEN salary <  70000 THEN 1 ELSE 0 END) AS lav\nFROM employees GROUP BY department;"},
{label:"5 · Pivot-teknikk",code:"SELECT\n  SUM(CASE WHEN YEAR(hire_date)=2022 THEN 1 ELSE 0 END) AS ans_2022,\n  SUM(CASE WHEN YEAR(hire_date)=2023 THEN 1 ELSE 0 END) AS ans_2023,\n  SUM(CASE WHEN YEAR(hire_date)=2024 THEN 1 ELSE 0 END) AS ans_2024\nFROM employees;"},
{label:"6 · CASE i UPDATE",code:"UPDATE products SET price = CASE\n  WHEN category='Premium' THEN price*1.10\n  WHEN category='Budget'  THEN price*0.90\n  ELSE price\nEND;"},
{label:"7 · NULL-håndtering",code:"SELECT name,\n  CASE\n    WHEN phone IS NULL AND email IS NULL THEN 'Ingen kontakt'\n    WHEN phone IS NULL THEN 'Kun e-post'\n    WHEN email IS NULL THEN 'Kun telefon'\n    ELSE 'Begge'\n  END AS kontakt\nFROM customers;"},
{label:"8 · Beregn rabatt",code:"SELECT order_id, amount,\n  CASE\n    WHEN amount >= 10000 THEN amount*0.15\n    WHEN amount >= 5000  THEN amount*0.10\n    WHEN amount >= 1000  THEN amount*0.05\n    ELSE 0\n  END AS rabatt\nFROM orders;"},
{label:"9 · Nestet CASE",code:"SELECT name, salary, years_exp,\n  CASE\n    WHEN years_exp >= 10 THEN\n      CASE WHEN salary >= 90000 THEN 'Senior A' ELSE 'Senior B' END\n    WHEN years_exp >= 5 THEN 'Erfaren'\n    ELSE 'Junior'\n  END AS kategori\nFROM employees;"},
{label:"10 · CASE som filterbetingelse",code:"SELECT * FROM orders\nWHERE CASE customer_type\n  WHEN 'VIP'    THEN amount >= 100\n  WHEN 'Normal' THEN amount >= 500\n  ELSE amount >= 1000\nEND;"}
]},
{id:"union",cmd:"UNION / UNION ALL",cat:"sel",catLabel:"SELECT",
desc:"Kombiner resultater fra to SELECT-setninger vertikalt.",
tags:["union","union all","kombinere","stable rader","duplikater"],
difficulty:"intermediate",related:["select-cmd","cte"],
pitfalls:["UNION fjerner duplikater (tregere) — bruk UNION ALL hvis duplikater er OK.","Begge SELECT MÅ ha samme antall kolonner og kompatible datatyper."],
when:["Slå sammen lik struktur","Rapport med totallinje","Kombiner historiske data"],
examples:[
{label:"1 · UNION (fjerner duplikater)",code:"SELECT name FROM employees WHERE dept='IT'\nUNION\nSELECT name FROM contractors WHERE dept='IT';"},
{label:"2 · UNION ALL (raskere)",code:"SELECT product_id, amount FROM q1_sales\nUNION ALL\nSELECT product_id, amount FROM q2_sales;"},
{label:"3 · Kombiner kunder og leverandører",code:"SELECT id, name, 'Kunde' AS type FROM customers\nUNION ALL\nSELECT id, name, 'Leverandør' FROM suppliers\nORDER BY name;"},
{label:"4 · Aktive og arkiverte",code:"SELECT id, name, salary, 'Aktiv' AS status FROM employees\nUNION ALL\nSELECT id, name, salary, 'Arkivert' FROM archive_employees\nORDER BY id;"},
{label:"5 · UNION med konstantkolonne",code:"SELECT 'Jan' AS mnd, SUM(amount) AS tot FROM jan_sales\nUNION ALL SELECT 'Feb', SUM(amount) FROM feb_sales\nUNION ALL SELECT 'Mar', SUM(amount) FROM mar_sales;"},
{label:"6 · Aggregér kombinert data",code:"SELECT category, SUM(revenue) AS tot FROM (\n  SELECT category, revenue FROM online_sales\n  UNION ALL\n  SELECT category, revenue FROM offline_sales\n) alle GROUP BY category ORDER BY tot DESC;"},
{label:"7 · Rapport med totalrad",code:"SELECT department, SUM(salary) AS total FROM employees\nGROUP BY department\nUNION ALL\nSELECT 'TOTAL', SUM(salary) FROM employees\nORDER BY total DESC;"},
{label:"8 · Fyll datohull",code:"SELECT date, sales FROM sales_2023\nUNION ALL\nSELECT date, sales FROM sales_2024\nORDER BY date;"},
{label:"9 · UNION + CTE",code:"WITH alle AS (\n  SELECT id, amount, 'Inn' AS type FROM payments\n  UNION ALL\n  SELECT id, amount, 'Ut' FROM withdrawals\n)\nSELECT type, COUNT(*) AS ant, SUM(amount) AS total\nFROM alle GROUP BY type;"},
{label:"10 · FULL OUTER JOIN emulert (MySQL)",code:"-- MySQL støtter ikke FULL OUTER JOIN — bruk UNION:\nSELECT e.name, d.dept_name FROM employees e\nLEFT JOIN departments d ON e.dept_id=d.id\nUNION\nSELECT e.name, d.dept_name FROM employees e\nRIGHT JOIN departments d ON e.dept_id=d.id;"}
]},

{id:"insert",cmd:"INSERT INTO",cat:"dml",catLabel:"DML",
desc:"Legg til én eller flere rader i en MySQL-tabell.",
tags:["insert","sett inn","legg til","ny rad","bulk insert"],
difficulty:"beginner",related:["update","upsert","select-cmd","transaction"],
pitfalls:["Uten kolonneliste bestemmes rekkefølgen av tabelldefinisjonen — farlig ved schema-endringer."],
when:["Legg til enkeltrad","Bulk-insert mange rader","Kopier data fra annen tabell"],
examples:[
{label:"1 · Én rad",code:"INSERT INTO employees (name, department, salary, hire_date)\nVALUES ('Alice', 'IT', 65000, '2024-03-01');"},
{label:"2 · Minimalt",code:"INSERT INTO products (name, price) VALUES ('Tastatur', 499.00);"},
{label:"3 · Flere rader",code:"INSERT INTO employees (name, department, salary) VALUES\n  ('Bob',   'Finance', 72000),\n  ('Carol', 'IT',      68000),\n  ('Dave',  'HR',      55000);"},
{label:"4 · Fra SELECT",code:"INSERT INTO archive_employees (id, name, salary)\nSELECT id, name, salary FROM employees\nWHERE termination_date < '2024-01-01';"},
{label:"5 · DEFAULT-verdier",code:"INSERT INTO logs (user_id, action) VALUES (42,'LOGIN');\n-- created_at bruker DEFAULT CURRENT_TIMESTAMP"},
{label:"6 · Beregnet verdi",code:"INSERT INTO order_items (order_id, product_id, qty, unit_price, total)\nVALUES (101, 5, 3, 299.00, 3*299.00);"},
{label:"7 · INSERT IGNORE",code:"INSERT IGNORE INTO subscribers (email) VALUES ('alice@example.com');\n-- ingen feil om e-posten finnes"},
{label:"8 · ON DUPLICATE KEY UPDATE",code:"INSERT INTO page_views (url, views) VALUES ('/hjem', 1)\nON DUPLICATE KEY UPDATE views = views+1, last_seen = NOW();"},
{label:"9 · Fra aggregert subquery",code:"INSERT INTO dept_budgets (dept_id, approved)\nSELECT id, (SELECT SUM(salary) FROM employees WHERE dept_id=d.id)*1.2\nFROM departments d;"},
{label:"10 · Månedlig rapport",code:"INSERT INTO monthly_report (month, dept, emp_count, avg_salary)\nSELECT DATE_FORMAT(CURDATE(),'%Y-%m'), department,\n  COUNT(*), ROUND(AVG(salary),2)\nFROM employees GROUP BY department;"}
]},
{id:"update",cmd:"UPDATE",cat:"dml",catLabel:"DML",
desc:"Endre eksisterende rader i en MySQL-tabell.",
tags:["update","oppdater","endre","modifiser","sett verdi"],
difficulty:"beginner",related:["delete","transaction","select-cmd","upsert"],
pitfalls:["UPDATE uten WHERE oppdaterer ALLE rader!","MySQL Workbench: Safe Updates er aktivert som standard — bruk primærnøkkel i WHERE.","Kjør alltid SELECT med samme WHERE FØR UPDATE."],
when:["Endre verdier","Oppdater med beregning","Oppdater fra annen tabell via JOIN"],
examples:[
{label:"1 · Enkel oppdatering",code:"UPDATE employees SET salary = 75000 WHERE id = 42;"},
{label:"2 · Beregnet verdi",code:"UPDATE employees SET salary = salary*1.05 WHERE department='IT';"},
{label:"3 · Flere kolonner",code:"UPDATE employees\nSET department='Engineering', manager_id=5, updated_at=NOW()\nWHERE id=42;"},
{label:"4 · JOIN-basert UPDATE",code:"UPDATE employees e\nJOIN bonuses b ON e.id = b.employee_id\nSET e.salary = e.salary + b.amount\nWHERE b.year = 2024;"},
{label:"5 · CASE i UPDATE",code:"UPDATE products SET price = CASE\n  WHEN category='Premium' THEN price*1.10\n  WHEN category='Budget'  THEN price*0.90\n  ELSE price\nEND;"},
{label:"6 · Sett NULL",code:"UPDATE employees SET manager_id = NULL WHERE id = 15;"},
{label:"7 · Dato-oppdatering",code:"UPDATE orders SET shipped_date = CURDATE(), status='Sendt'\nWHERE id IN (101,102,103);"},
{label:"8 · LIMIT for batch",code:"UPDATE logs SET processed = 1\nWHERE processed = 0\nORDER BY created_at LIMIT 1000;"},
{label:"9 · Subquery i SET",code:"UPDATE employees e\nSET e.salary = (\n  SELECT avd_snitt FROM (\n    SELECT dept_id, AVG(salary) AS avd_snitt\n    FROM employees GROUP BY dept_id\n  ) t WHERE t.dept_id = e.dept_id\n)\nWHERE e.salary < 30000;"},
{label:"10 · Sjekk FØR update — anbefalt praksis",code:"-- Steg 1: Sjekk hva som endres\nSELECT id, name, salary FROM employees\nWHERE department='IT' AND hire_date<'2020-01-01';\n\n-- Steg 2: Kjør UPDATE med IDENTISK WHERE\nUPDATE employees SET salary = salary*1.08\nWHERE department='IT' AND hire_date<'2020-01-01';"}
]},
{id:"delete",cmd:"DELETE",cat:"dml",catLabel:"DML",
desc:"Slett én eller flere rader fra en MySQL-tabell.",
tags:["delete","slett","fjern","rens"],
difficulty:"beginner",related:["transaction","truncate","update","select-cmd"],
pitfalls:["DELETE uten WHERE sletter ALLE rader.","MySQL Workbench Safe Updates: bruk primærnøkkel i WHERE.","Kjør SELECT med samme WHERE FØR DELETE."],
when:["Slett spesifikke rader","Batch-rydding","Slett relaterte rader via JOIN"],
examples:[
{label:"1 · Slett med primærnøkkel",code:"DELETE FROM employees WHERE id = 42;"},
{label:"2 · Slett med betingelse",code:"DELETE FROM sessions WHERE expires_at < NOW();"},
{label:"3 · Slett via subquery",code:"DELETE FROM orders\nWHERE customer_id IN (SELECT id FROM customers WHERE active=0);"},
{label:"4 · Antall slettede rader",code:"DELETE FROM logs WHERE created_at < '2023-01-01';\nSELECT ROW_COUNT();  -- viser antall slettede"},
{label:"5 · LIMIT for sikker batch",code:"DELETE FROM logs WHERE processed = 1\nORDER BY created_at LIMIT 1000;"},
{label:"6 · JOIN-DELETE",code:"DELETE oi FROM order_items oi\nJOIN orders o ON oi.order_id = o.id\nWHERE o.status='Kansellert' AND o.created_at<'2023-01-01';"},
{label:"7 · Slett duplikater",code:"DELETE FROM users WHERE id NOT IN (\n  SELECT min_id FROM (\n    SELECT MIN(id) AS min_id FROM users GROUP BY email\n  ) t\n);"},
{label:"8 · Slett gamle tokens",code:"DELETE FROM temp_tokens\nWHERE created_at < DATE_SUB(NOW(), INTERVAL 24 HOUR);"},
{label:"9 · Transaksjonsbeskyttet",code:"START TRANSACTION;\nDELETE FROM order_items WHERE order_id = 99;\nDELETE FROM orders WHERE id = 99;\nSELECT ROW_COUNT();\nCOMMIT;  -- eller ROLLBACK"},
{label:"10 · Sjekk FØR sletting",code:"-- Steg 1: Sjekk\nSELECT COUNT(*) FROM logs WHERE processed=1;\n-- Steg 2: Slett\nDELETE FROM logs WHERE processed=1;"}
]},
{id:"upsert",cmd:"INSERT … ON DUPLICATE KEY",cat:"dml",catLabel:"DML",
desc:"Sett inn rad — oppdater hvis den finnes (MySQL upsert).",
tags:["upsert","on duplicate key","insert ignore","replace into","synkroniser"],
difficulty:"intermediate",related:["insert","update","transaction"],
pitfalls:["Krever UNIQUE- eller PRIMARY KEY-begrensning.","REPLACE INTO sletter og setter inn på nytt — mister fremmednøkkel-referanser!"],
when:["Skriv uten å vite om raden finnes","Synkroniser data","Inkrementer teller"],
examples:[
{label:"1 · Grunnleggende upsert",code:"INSERT INTO employees (id, name, salary)\nVALUES (1, 'Alice', 75000)\nON DUPLICATE KEY UPDATE salary = VALUES(salary);"},
{label:"2 · Oppdater flere kolonner",code:"INSERT INTO products (id, name, price, stock)\nVALUES (101, 'Tastatur', 499, 50)\nON DUPLICATE KEY UPDATE\n  price = VALUES(price), stock = VALUES(stock);"},
{label:"3 · Inkrementer teller",code:"INSERT INTO page_views (url, views) VALUES ('/hjem', 1)\nON DUPLICATE KEY UPDATE\n  views = views + 1, last_seen = NOW();"},
{label:"4 · INSERT IGNORE",code:"INSERT IGNORE INTO unique_visits (user_id, page, visit_date)\nVALUES (42, '/hjem', CURDATE());"},
{label:"5 · Bulk upsert",code:"INSERT INTO inventory (product_id, stock)\nVALUES (1,100),(2,200),(3,150)\nON DUPLICATE KEY UPDATE stock = VALUES(stock);"},
{label:"6 · Betinget oppdatering",code:"INSERT INTO prices (product_id, price)\nVALUES (101, 499.00)\nON DUPLICATE KEY UPDATE\n  price = IF(VALUES(price) < price, VALUES(price), price);"},
{label:"7 · REPLACE INTO (forsiktig!)",code:"-- ⚠️ Sletter gammel rad og setter inn ny\nREPLACE INTO config (key_name, value) VALUES ('timeout','30');"},
{label:"8 · Sjekk resultat med ROW_COUNT()",code:"INSERT INTO subscribers (email, created_at)\nVALUES ('ny@ex.com', NOW())\nON DUPLICATE KEY UPDATE email = email;\nSELECT ROW_COUNT();\n-- 1 = ny rad, 2 = oppdatert, 0 = ingen endring"},
{label:"9 · Upsert fra SELECT",code:"INSERT INTO kategori_stats (kategori, total, antall)\nSELECT category, SUM(price), COUNT(*) FROM products GROUP BY category\nON DUPLICATE KEY UPDATE\n  total = VALUES(total), antall = VALUES(antall);"},
{label:"10 · Synkroniser fra ekstern kilde",code:"INSERT INTO products (sku, name, price, updated_at)\nVALUES ('ABC123', 'Mus', 299, NOW())\nON DUPLICATE KEY UPDATE\n  name = VALUES(name), price = VALUES(price), updated_at = NOW();"}
]},
{id:"truncate",cmd:"TRUNCATE TABLE",cat:"dml",catLabel:"DML",
desc:"Fjern ALLE rader øyeblikkelig — mye raskere enn DELETE.",
tags:["truncate","tøm","nullstill","auto_increment reset"],
difficulty:"intermediate",related:["delete","transaction","create-table"],
pitfalls:["TRUNCATE kan IKKE rulles tilbake i MySQL.","Triggere kjøres IKKE.","Fremmednøkkel-begrensninger kan hindre TRUNCATE."],
when:["Tøm hel tabell raskt","Nullstill testdata","Reset AUTO_INCREMENT"],
examples:[
{label:"1 · Enkel truncate",code:"TRUNCATE TABLE session_logs;"},
{label:"2 · Nullstiller AUTO_INCREMENT",code:"TRUNCATE TABLE users;\n-- Neste INSERT får id=1"},
{label:"3 · Ytelse vs DELETE",code:"-- TRUNCATE: O(1)\nTRUNCATE TABLE big_log_table;\n-- DELETE: O(n) — veldig tregt på store tabeller"},
{label:"4 · Med fremmednøkkel",code:"SET FOREIGN_KEY_CHECKS = 0;\nTRUNCATE TABLE order_items;\nTRUNCATE TABLE orders;\nSET FOREIGN_KEY_CHECKS = 1;"},
{label:"5 · Nullstill testdata",code:"TRUNCATE TABLE test_users;\nTRUNCATE TABLE test_orders;\nTRUNCATE TABLE test_products;"},
{label:"6 · Backup FØR truncate",code:"CREATE TABLE backup_orders AS SELECT * FROM orders;\nTRUNCATE TABLE orders;"},
{label:"7 · Tøm og fyll på nytt",code:"TRUNCATE TABLE department_stats;\nINSERT INTO department_stats (dept, ant, snitt)\nSELECT department, COUNT(*), AVG(salary)\nFROM employees GROUP BY department;"},
{label:"8 · TRUNCATE vs DROP",code:"-- TRUNCATE: beholder struktur\nTRUNCATE TABLE logs;\n-- DROP: fjerner tabell helt\n-- DROP TABLE logs;"},
{label:"9 · Sjekk FØR/ETTER",code:"SELECT COUNT(*) AS før FROM logs;\nTRUNCATE TABLE logs;\nSELECT COUNT(*) AS etter FROM logs;  -- 0"},
{label:"10 · Når velge TRUNCATE vs DELETE?",code:"-- TRUNCATE når:\n--   Fjerne ALLE rader\n--   Høy ytelse er viktig\n--   Reset AUTO_INCREMENT\n\n-- DELETE når:\n--   Trenger WHERE-filter\n--   Trenger ROLLBACK\n--   Triggere skal kjøre"}
]},
{id:"inner-join",cmd:"INNER JOIN",cat:"join",catLabel:"JOIN",
desc:"Returner kun rader som har samsvar i BEGGE tabeller.",
tags:["inner join","koble","samsvar","match","equi-join"],
difficulty:"beginner",related:["left-join","cross-join","self-join"],
pitfalls:["JOIN uten ON gir kartesisk produkt.","Manglende indeks på JOIN-kolonne er den vanligste ytelsesfeilen."],
when:["Kombiner med felles nøkkel","Finn bare matchede rader"],
examples:[
{label:"1 · Enkel INNER JOIN",code:"SELECT e.name, d.dept_name\nFROM employees e\nINNER JOIN departments d ON e.dept_id = d.id;"},
{label:"2 · Tre tabeller",code:"SELECT o.id, c.name, p.title\nFROM orders o\nJOIN customers c ON o.customer_id = c.id\nJOIN products p ON o.product_id = p.id;"},
{label:"3 · Med WHERE",code:"SELECT e.name, d.dept_name, e.salary\nFROM employees e JOIN departments d ON e.dept_id = d.id\nWHERE e.salary > 60000;"},
{label:"4 · Med GROUP BY",code:"SELECT d.dept_name, COUNT(e.id) AS ant, AVG(e.salary) AS snitt\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name ORDER BY snitt DESC;"},
{label:"5 · Med HAVING",code:"SELECT d.dept_name, AVG(e.salary) AS snitt\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name HAVING snitt > 65000;"},
{label:"6 · Fire tabeller",code:"SELECT c.name, o.id, p.name AS prod, cat.name AS kat\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nJOIN order_items oi ON oi.order_id = o.id\nJOIN products p ON p.id = oi.product_id\nJOIN categories cat ON cat.id = p.category_id;"},
{label:"7 · JOIN + BETWEEN",code:"SELECT e.name, s.salary_band\nFROM employees e\nJOIN salary_bands s ON e.salary BETWEEN s.min_sal AND s.max_sal;"},
{label:"8 · JOIN + LIKE",code:"SELECT e.name, d.dept_name FROM employees e\nJOIN departments d ON e.dept_id = d.id\nWHERE d.dept_name LIKE '%IT%';"},
{label:"9 · Aggregat + HAVING",code:"SELECT d.dept_name, COUNT(*) AS ant, SUM(e.salary) AS total\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name HAVING total > 300000\nORDER BY total DESC;"},
{label:"10 · JOIN + vindufunksjon",code:"SELECT e.name, d.dept_name, e.salary,\n  RANK() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS rang\nFROM employees e JOIN departments d ON e.dept_id = d.id\nORDER BY d.dept_name, rang;"}
]},
{id:"left-join",cmd:"LEFT JOIN",cat:"join",catLabel:"JOIN",
desc:"Returner alle rader fra venstre tabell; NULL for rader uten samsvar i høyre.",
tags:["left join","alle venstre","ytre","anti-join","null for høyre"],
difficulty:"beginner",related:["inner-join","null-check"],
pitfalls:["WHERE-filter på høyre tabellen konverterer LEFT JOIN til INNER JOIN — flytt til ON.","Bruk COALESCE rundt aggregater fra høyre tabellen."],
when:["Behold alle venstrerader","Anti-join (finn manglende)","Valgfrie relasjoner"],
examples:[
{label:"1 · Enkel LEFT JOIN",code:"SELECT e.name, p.project_name\nFROM employees e\nLEFT JOIN projects p ON e.id = p.employee_id;"},
{label:"2 · Anti-join: finn rader uten match",code:"SELECT e.name FROM employees e\nLEFT JOIN projects p ON e.id = p.employee_id\nWHERE p.id IS NULL;"},
{label:"3 · Kunder uten bestillinger",code:"SELECT c.name FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;"},
{label:"4 · COUNT inkl. avd med 0 ansatte",code:"SELECT d.dept_name, COUNT(e.id) AS ant\nFROM departments d\nLEFT JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name;"},
{label:"5 · COALESCE for NULL-håndtering",code:"SELECT c.name, COALESCE(SUM(o.amount), 0) AS total\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name ORDER BY total DESC;"},
{label:"6 · To LEFT JOINs",code:"SELECT e.name, d.dept_name, p.project_name\nFROM employees e\nLEFT JOIN departments d ON e.dept_id = d.id\nLEFT JOIN projects p    ON e.id = p.employee_id;"},
{label:"7 · Filter på venstre (OK)",code:"SELECT e.name, p.project_name FROM employees e\nLEFT JOIN projects p ON e.id = p.employee_id\nWHERE e.department = 'IT';"},
{label:"8 · Filter på høyre: flytt til ON",code:"-- ❌ WHERE p.active=1 fjerner NULL-rader!\n-- ✅ Flytt til ON:\nSELECT e.name, p.name FROM employees e\nLEFT JOIN projects p\n  ON e.id = p.employee_id AND p.active = 1;"},
{label:"9 · Siste ordre per kunde",code:"SELECT e.name, lo.order_date FROM employees e\nLEFT JOIN (\n  SELECT employee_id, MAX(order_date) AS order_date\n  FROM orders GROUP BY employee_id\n) lo ON lo.employee_id = e.id;"},
{label:"10 · Sammenlign to perioder",code:"SELECT p.name,\n  COALESCE(a.total, 0) AS jan,\n  COALESCE(b.total, 0) AS feb\nFROM products p\nLEFT JOIN (SELECT product_id, SUM(qty) total FROM sales\n  WHERE MONTH(date)=1 GROUP BY product_id) a ON a.product_id = p.id\nLEFT JOIN (SELECT product_id, SUM(qty) total FROM sales\n  WHERE MONTH(date)=2 GROUP BY product_id) b ON b.product_id = p.id;"}
]},
{id:"right-join",cmd:"RIGHT JOIN",cat:"join",catLabel:"JOIN",
desc:"Returner alle rader fra høyre tabell; NULL for rader uten samsvar i venstre.",
tags:["right join","alle høyre","speilbilde left join"],
difficulty:"beginner",related:["left-join","inner-join"],
pitfalls:["RIGHT JOIN kan alltid skrives som LEFT JOIN ved å bytte tabellrekkefølge — mer lesbart."],
when:["Speilbilde av LEFT JOIN","Behold alle høyrerader"],
examples:[
{label:"1 · Enkel RIGHT JOIN",code:"SELECT e.name, p.project_name\nFROM employees e\nRIGHT JOIN projects p ON e.id = p.employee_id;\n-- Alle prosjekter, selv uten ansatte"},
{label:"2 · Ekvivalent LEFT JOIN (anbefalt)",code:"-- Mer lesbart:\nSELECT e.name, p.project_name\nFROM projects p\nLEFT JOIN employees e ON e.id = p.employee_id;"},
{label:"3 · Prosjekter uten ansatte",code:"SELECT p.project_name FROM employees e\nRIGHT JOIN projects p ON e.id = p.employee_id\nWHERE e.id IS NULL;"},
{label:"4 · Alle avdelinger uten ansatte",code:"SELECT e.name, d.dept_name\nFROM employees e\nRIGHT JOIN departments d ON e.dept_id = d.id\nORDER BY d.dept_name, e.name;"},
{label:"5 · COUNT med RIGHT JOIN",code:"SELECT d.dept_name, COUNT(e.id) AS ansatte\nFROM employees e\nRIGHT JOIN departments d ON e.dept_id = d.id\nGROUP BY d.dept_name;"},
{label:"6 · FULL OUTER emulering med UNION",code:"-- MySQL har ikke FULL OUTER JOIN — emuler:\nSELECT e.name, d.dept_name FROM employees e\nLEFT JOIN departments d ON e.dept_id = d.id\nUNION\nSELECT e.name, d.dept_name FROM employees e\nRIGHT JOIN departments d ON e.dept_id = d.id;"},
{label:"7 · RIGHT JOIN med filter",code:"SELECT e.name, p.project_name\nFROM employees e\nRIGHT JOIN projects p ON e.id = p.employee_id\nWHERE p.priority = 'Høy';"},
{label:"8 · RIGHT JOIN med GROUP BY",code:"SELECT d.dept_name, COALESCE(COUNT(e.id), 0) AS ant\nFROM employees e\nRIGHT JOIN departments d ON e.dept_id = d.id\nGROUP BY d.dept_name ORDER BY ant DESC;"},
{label:"9 · Tre tabeller med RIGHT JOIN",code:"SELECT p.name, o.id AS order_id, c.name AS kunde\nFROM orders o\nJOIN customers c ON c.id = o.customer_id\nRIGHT JOIN products p ON p.id = o.product_id;"},
{label:"10 · Lagerrapport med RIGHT JOIN",code:"SELECT\n  p.name AS produkt,\n  COALESCE(SUM(oi.qty), 0) AS solgt_stk,\n  p.stock AS lager\nFROM order_items oi\nRIGHT JOIN products p ON p.id = oi.product_id\nGROUP BY p.id, p.name, p.stock\nORDER BY solgt_stk DESC;"}
]},
{id:"self-join",cmd:"Self JOIN",cat:"join",catLabel:"JOIN",
desc:"Koble en tabell til seg selv — for hierarkier og sammenligning.",
tags:["self join","hierarki","leder","forelder","org-kart"],
difficulty:"intermediate",related:["recursive-cte","inner-join"],
pitfalls:["Bruk alltid to ulike aliaser.","For dype hierarkier: bruk rekursiv CTE."],
when:["Org-kart","Sammenlign rader i samme tabell"],
examples:[
{label:"1 · Ansatt og leder",code:"SELECT e.name AS ansatt, m.name AS leder\nFROM employees e JOIN employees m ON e.manager_id = m.id;"},
{label:"2 · Inkluder uten leder (LEFT)",code:"SELECT e.name, COALESCE(m.name, 'Ingen leder') AS leder\nFROM employees e LEFT JOIN employees m ON e.manager_id = m.id;"},
{label:"3 · Direkte underordnede",code:"SELECT e.name FROM employees e\nJOIN employees m ON e.manager_id = m.id\nWHERE m.name = 'Anne Hansen';"},
{label:"4 · Kategori-hierarki",code:"SELECT c.name AS underkategori, p.name AS overkategori\nFROM categories c LEFT JOIN categories p ON c.parent_id = p.id;"},
{label:"5 · Ansatte med høyere lønn enn leder",code:"SELECT e.name, e.salary, m.name AS leder, m.salary AS leder_lønn\nFROM employees e JOIN employees m ON e.manager_id = m.id\nWHERE e.salary > m.salary;"},
{label:"6 · Antall underordnede",code:"SELECT m.name AS leder, COUNT(e.id) AS underordnede\nFROM employees m JOIN employees e ON e.manager_id = m.id\nGROUP BY m.id, m.name ORDER BY underordnede DESC;"},
{label:"7 · Prissammenligning",code:"SELECT a.name AS p1, b.name AS p2, a.price - b.price AS diff\nFROM products a JOIN products b\n  ON a.category = b.category AND a.id < b.id\nORDER BY ABS(a.price - b.price) DESC;"},
{label:"8 · Søsken-noder",code:"SELECT a.name, b.name AS kollega\nFROM employees a JOIN employees b\n  ON a.manager_id = b.manager_id AND a.id != b.id;"},
{label:"9 · Tre-nivå hierarki",code:"SELECT a.name AS direktør, b.name AS mellomleder, c.name AS ansatt\nFROM employees c\nJOIN employees b ON c.manager_id = b.id\nJOIN employees a ON b.manager_id = a.id\nWHERE a.manager_id IS NULL\nORDER BY a.name, b.name, c.name;"},
{label:"10 · Løvnoder (uten underordnede)",code:"SELECT e.name FROM employees e\nLEFT JOIN employees sub ON sub.manager_id = e.id\nWHERE sub.id IS NULL;"}
]},
{id:"cross-join",cmd:"CROSS JOIN",cat:"join",catLabel:"JOIN",
desc:"Returner alle mulige kombinasjoner — kartesisk produkt.",
tags:["cross join","kartesisk","alle kombinasjoner","par"],
difficulty:"intermediate",related:["inner-join","self-join"],
pitfalls:["Rader_A × Rader_B — 1000×1000 = 1 million rader!","Utilsiktet CROSS JOIN: JOIN uten ON-betingelse."],
when:["Generer alle kombinasjoner","Testdata","Matrise-rapporter"],
examples:[
{label:"1 · Produkt × farge",code:"SELECT p.name, c.color\nFROM products p\nCROSS JOIN colors c;"},
{label:"2 · Ansatte × prosjekter",code:"SELECT e.name, p.project_name\nFROM employees e\nCROSS JOIN projects p\nORDER BY e.name, p.project_name;"},
{label:"3 · Måned × avdeling",code:"SELECT m.month_name, d.dept_name\nFROM months m\nCROSS JOIN departments d\nORDER BY m.month_num, d.dept_name;"},
{label:"4 · Størrelse × farge (nettbutikk)",code:"SELECT s.size, c.color, COUNT(*) AS ant\nFROM sizes s\nCROSS JOIN colors c\nGROUP BY s.size, c.color;"},
{label:"5 · Generer kalender-rader",code:"SELECT DATE_ADD('2024-01-01', INTERVAL n.n DAY) AS dato\nFROM (\n  SELECT 0 n UNION ALL SELECT 1 UNION ALL SELECT 2\n  UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5\n  UNION ALL SELECT 6\n) n;"},
{label:"6 · Sjekke alle prispar",code:"SELECT a.name, b.name, ABS(a.price - b.price) AS diff\nFROM products a\nCROSS JOIN products b\nWHERE a.id < b.id AND a.category = b.category;"},
{label:"7 · Tom matrise: ansatt × kvartal",code:"SELECT e.name, q.quarter\nFROM employees e\nCROSS JOIN (\n  SELECT 'Q1' quarter UNION ALL SELECT 'Q2'\n  UNION ALL SELECT 'Q3' UNION ALL SELECT 'Q4'\n) q;"},
{label:"8 · Utilsiktet CROSS JOIN — unngå!",code:"-- ⚠️ ADVARSEL: utilsiktet kartesisk produkt\nSELECT * FROM employees, departments;  -- mangler WHERE/ON!"},
{label:"9 · Manglende kompetanse",code:"SELECT e.name, s.skill\nFROM employees e\nCROSS JOIN required_skills s\nWHERE NOT EXISTS (\n  SELECT 1 FROM employee_skills es\n  WHERE es.emp_id = e.id AND es.skill = s.skill\n);"},
{label:"10 · Cross join for testdata",code:"INSERT INTO test_orders (customer_id, product_id, qty)\nSELECT c.id, p.id, FLOOR(1 + RAND()*10)\nFROM customers c\nCROSS JOIN products p\nWHERE RAND() < 0.2;  -- ca. 20% av kombinasjonene"}
]},
{id:"count",cmd:"COUNT()",cat:"agg",catLabel:"AGGREGAT",
desc:"Tell antall rader, ikke-NULL-verdier eller unike verdier.",
tags:["count","tell","antall","count distinct"],
difficulty:"beginner",related:["group-by","sum-avg","distinct"],
pitfalls:["COUNT(kol) ignorerer NULL — COUNT(*) teller ALT.","COUNT(DISTINCT kol) er tregere."],
when:["Tell totalt","Tell per gruppe","Finn duplikater"],
examples:[
{label:"1 · Tell alle",code:"SELECT COUNT(*) FROM employees;"},
{label:"2 · Tell ikke-NULL",code:"SELECT COUNT(manager_id) AS med_leder FROM employees;"},
{label:"3 · Tell unike",code:"SELECT COUNT(DISTINCT department) AS avd FROM employees;"},
{label:"4 · Per gruppe",code:"SELECT department, COUNT(*) AS ant FROM employees GROUP BY department;"},
{label:"5 · Med WHERE",code:"SELECT department, COUNT(*) FROM employees\nWHERE salary > 60000 GROUP BY department;"},
{label:"6 · HAVING",code:"SELECT department, COUNT(*) AS ant FROM employees\nGROUP BY department HAVING ant > 5;"},
{label:"7 · Betinget COUNT",code:"SELECT\n  COUNT(*) AS totalt,\n  COUNT(CASE WHEN salary>70000 THEN 1 END) AS høy,\n  COUNT(CASE WHEN salary<=70000 THEN 1 END) AS lav\nFROM employees;"},
{label:"8 · Via JOIN",code:"SELECT c.name, COUNT(o.id) AS ordrer\nFROM customers c LEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name ORDER BY ordrer DESC;"},
{label:"9 · Finn duplikater",code:"SELECT email, COUNT(*) AS ant FROM users\nGROUP BY email HAVING ant > 1\nORDER BY ant DESC;"},
{label:"10 · Prosentandel per gruppe",code:"SELECT department, COUNT(*) AS ant,\n  ROUND(COUNT(*)*100.0/SUM(COUNT(*)) OVER(), 1) AS prosent\nFROM employees GROUP BY department\nORDER BY prosent DESC;"}
]},
{id:"sum-avg",cmd:"SUM() / AVG()",cat:"agg",catLabel:"AGGREGAT",
desc:"Beregn sum og gjennomsnitt av en numerisk kolonne.",
tags:["sum","avg","total","gjennomsnitt","snitt"],
difficulty:"beginner",related:["group-by","min-max","running-total"],
pitfalls:["AVG ignorerer NULL.","ROUND(AVG()) for å få pene tall."],
when:["Sum per gruppe","Gjennomsnitt","Kombinert statistikk"],
examples:[
{label:"1 · Total sum",code:"SELECT SUM(salary) AS total_lønn FROM employees;"},
{label:"2 · Gjennomsnitt",code:"SELECT ROUND(AVG(salary), 2) AS snitt FROM employees;"},
{label:"3 · Per avdeling",code:"SELECT department, SUM(salary) AS total\nFROM employees GROUP BY department;"},
{label:"4 · Kombinert",code:"SELECT department, COUNT(*) AS ant, SUM(salary) AS sum, ROUND(AVG(salary),0) AS snitt\nFROM employees GROUP BY department ORDER BY sum DESC;"},
{label:"5 · HAVING",code:"SELECT department, AVG(salary) AS snitt\nFROM employees GROUP BY department\nHAVING snitt > 60000;"},
{label:"6 · Beregnet kolonne",code:"SELECT SUM(quantity * unit_price) AS omsetning\nFROM order_items;"},
{label:"7 · Betinget SUM",code:"SELECT\n  SUM(CASE WHEN type='Inn' THEN amount ELSE 0 END) AS inntekter,\n  SUM(CASE WHEN type='Ut'  THEN amount ELSE 0 END) AS utgifter\nFROM transactions;"},
{label:"8 · Via JOIN",code:"SELECT d.dept_name, SUM(e.salary) AS avd_kost\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name ORDER BY avd_kost DESC;"},
{label:"9 · Sammenlign med totalt snitt",code:"SELECT department,\n  ROUND(AVG(salary), 0) AS avd_snitt,\n  ROUND((SELECT AVG(salary) FROM employees), 0) AS total_snitt,\n  ROUND(AVG(salary) - (SELECT AVG(salary) FROM employees), 0) AS diff\nFROM employees GROUP BY department;"},
{label:"10 · Rullende sum (vindu)",code:"SELECT order_date, daily_tot,\n  SUM(daily_tot) OVER(ORDER BY order_date) AS kumulativ\nFROM (\n  SELECT DATE(order_date) AS order_date, SUM(amount) AS daily_tot\n  FROM orders GROUP BY DATE(order_date)\n) dag;"}
]},
{id:"min-max",cmd:"MIN() / MAX()",cat:"agg",catLabel:"AGGREGAT",
desc:"Finn minste eller største verdi — fungerer på tall, datoer og tekst.",
tags:["min","max","minimum","maksimum","ekstrem"],
difficulty:"beginner",related:["group-by","sum-avg","order-by"],
pitfalls:["MIN/MAX ignorerer NULL.","MIN på tekst er leksikografisk minimum."],
when:["Finn ekstremverdier","Første/siste dato","Prisintervall per kategori"],
examples:[
{label:"1 · Laveste og høyeste lønn",code:"SELECT MIN(salary) AS lavest, MAX(salary) AS høyest FROM employees;"},
{label:"2 · Tidligste og seneste bestilling",code:"SELECT MIN(order_date) AS første, MAX(order_date) AS siste\nFROM orders;"},
{label:"3 · Per gruppe",code:"SELECT department, MIN(salary) AS min, MAX(salary) AS max,\n  MAX(salary)-MIN(salary) AS spenn\nFROM employees GROUP BY department;"},
{label:"4 · Produkt med lavest pris",code:"SELECT name, price FROM products\nWHERE price = (SELECT MIN(price) FROM products);"},
{label:"5 · MIN/MAX på tekst",code:"SELECT MIN(name) AS første_navn, MAX(name) AS siste_navn\nFROM employees;"},
{label:"6 · Kombinert med COUNT/AVG",code:"SELECT department, COUNT(*) AS ant,\n  MIN(salary), MAX(salary), ROUND(AVG(salary),0) AS snitt\nFROM employees GROUP BY department;"},
{label:"7 · Siste bestilling per kunde",code:"SELECT customer_id, MAX(order_date) AS siste\nFROM orders GROUP BY customer_id\nORDER BY siste DESC;"},
{label:"8 · Finn raden med MIN via JOIN",code:"SELECT e.* FROM employees e\nJOIN (\n  SELECT dept_id, MIN(salary) AS min_sal\n  FROM employees GROUP BY dept_id\n) m ON e.dept_id = m.dept_id AND e.salary = m.min_sal;"},
{label:"9 · MIN/MAX som vindufunksjon",code:"SELECT name, department, salary,\n  MIN(salary) OVER(PARTITION BY department) AS avd_min,\n  MAX(salary) OVER(PARTITION BY department) AS avd_max\nFROM employees;"},
{label:"10 · Variasjonskoeffisient",code:"SELECT department,\n  MIN(salary), MAX(salary),\n  ROUND(AVG(salary), 0) AS snitt,\n  MAX(salary)-MIN(salary) AS spenn,\n  ROUND((MAX(salary)-MIN(salary)) / AVG(salary) * 100, 1) AS variasjon_pst\nFROM employees GROUP BY department;"}
]},
{id:"group-by",cmd:"GROUP BY / HAVING",cat:"agg",catLabel:"AGGREGAT",
desc:"Grupper rader og filtrer grupper med aggregerte betingelser.",
tags:["group by","having","aggregat","grupper","per gruppe","filtrer grupper"],
difficulty:"intermediate",related:["count","sum-avg","window-over","rollup"],
pitfalls:["HAVING er for grupper, WHERE er for rader.","Alle ikke-aggregerte kolonner i SELECT MÅ stå i GROUP BY."],
when:["Aggreger per kategori","Filtrer grupper","Statistikk per gruppe"],
examples:[
{label:"1 · Enkel GROUP BY",code:"SELECT department, COUNT(*) AS ant FROM employees GROUP BY department;"},
{label:"2 · HAVING",code:"SELECT department, COUNT(*) AS ant FROM employees\nGROUP BY department HAVING ant > 5;"},
{label:"3 · Flere aggregater",code:"SELECT department, COUNT(*) AS ant, AVG(salary) AS snitt, MAX(salary) AS topp\nFROM employees GROUP BY department ORDER BY snitt DESC;"},
{label:"4 · WHERE + GROUP BY",code:"SELECT department, AVG(salary) AS snitt\nFROM employees WHERE hire_date >= '2020-01-01'\nGROUP BY department;"},
{label:"5 · GROUP BY + HAVING + ORDER BY",code:"SELECT department, COUNT(*) AS ant, SUM(salary) AS total\nFROM employees GROUP BY department\nHAVING total > 300000 ORDER BY total DESC;"},
{label:"6 · Gruppe på dato",code:"SELECT DATE_FORMAT(order_date, '%Y-%m') AS mnd,\n  COUNT(*) AS ordrer, SUM(amount) AS omsetn\nFROM orders GROUP BY mnd ORDER BY mnd;"},
{label:"7 · Via JOIN",code:"SELECT d.dept_name, COUNT(e.id) AS ant, SUM(e.salary) AS lønn\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.id, d.dept_name HAVING ant >= 3;"},
{label:"8 · Finn duplikater",code:"SELECT email, COUNT(*) AS ant FROM users\nGROUP BY email HAVING ant > 1;"},
{label:"9 · Gruppe på beregnet verdi",code:"SELECT CASE\n    WHEN salary < 50000  THEN '< 50k'\n    WHEN salary < 80000  THEN '50k–80k'\n    ELSE '80k+'\n  END AS lønnsbånd, COUNT(*) AS ant\nFROM employees GROUP BY lønnsbånd;"},
{label:"10 · WITH ROLLUP",code:"SELECT COALESCE(department, 'TOTAL') AS avd,\n  COUNT(*) AS ant, SUM(salary) AS total\nFROM employees GROUP BY department WITH ROLLUP;"}
]},
{id:"rollup",cmd:"GROUP BY … WITH ROLLUP",cat:"agg",catLabel:"AGGREGAT",
desc:"Generer delsum-rader og en totalsum automatisk med WITH ROLLUP.",
tags:["rollup","delsummer","totalsum","grouping","rapportering"],
difficulty:"advanced",related:["group-by"],
pitfalls:["NULL i ROLLUP-raden representerer totalsum — bruk COALESCE for lesbarhet.","GROUPING(kol) skiller mellom ekte NULL og ROLLUP-NULL."],
when:["Rapporter med totalsummer","Hierarkisk gruppering"],
examples:[
{label:"1 · Enkel ROLLUP",code:"SELECT department, SUM(salary) AS total\nFROM employees GROUP BY department WITH ROLLUP;"},
{label:"2 · Med COALESCE",code:"SELECT COALESCE(department, 'TOTAL') AS avd,\n  COUNT(*) AS ant, SUM(salary) AS total\nFROM employees GROUP BY department WITH ROLLUP;"},
{label:"3 · To grupperingsnivåer",code:"SELECT COALESCE(department, 'TOTAL') AS avd,\n  COALESCE(job_title, '--') AS tittel,\n  COUNT(*) AS ant\nFROM employees GROUP BY department, job_title WITH ROLLUP;"},
{label:"4 · GROUPING() for ROLLUP-rader",code:"SELECT\n  IF(GROUPING(department), 'TOTAL', department) AS avd,\n  IF(GROUPING(job_title),  'Alle',  job_title)  AS tittel,\n  COUNT(*)\nFROM employees GROUP BY department, job_title WITH ROLLUP;"},
{label:"5 · Kvartalsvis",code:"SELECT\n  COALESCE(CONCAT('Q', QUARTER(order_date)), 'ÅR-TOTAL') AS kvartal,\n  COUNT(*) AS ordrer, SUM(amount) AS total\nFROM orders WHERE YEAR(order_date) = 2024\nGROUP BY QUARTER(order_date) WITH ROLLUP;"},
{label:"6 · Salgsrapport",code:"SELECT COALESCE(category, 'TOTAL') AS kat,\n  SUM(qty) AS stk, SUM(revenue) AS omsetn\nFROM sales GROUP BY category WITH ROLLUP\nORDER BY category IS NULL, omsetn DESC;"},
{label:"7 · Budsjett vs faktisk",code:"SELECT COALESCE(dept, 'TOTAL') AS avd,\n  SUM(actual) AS faktisk, SUM(budget) AS budsjett,\n  SUM(actual)-SUM(budget) AS avvik\nFROM financials GROUP BY dept WITH ROLLUP;"},
{label:"8 · Via JOIN + ROLLUP",code:"SELECT COALESCE(d.dept_name, 'TOTALT') AS avd,\n  COUNT(e.id) AS ant, SUM(e.salary) AS lønn\nFROM departments d JOIN employees e ON e.dept_id = d.id\nGROUP BY d.dept_name WITH ROLLUP;"},
{label:"9 · Tre nivåer",code:"SELECT COALESCE(region, 'ALLE') AS reg,\n  COALESCE(category, 'ALLE') AS kat,\n  SUM(revenue) AS tot\nFROM sales GROUP BY region, category WITH ROLLUP;"},
{label:"10 · Sorter ROLLUP-rad sist",code:"SELECT COALESCE(department, 'TOTAL') AS avd,\n  COUNT(*) AS ant, SUM(salary) AS total\nFROM employees GROUP BY department WITH ROLLUP\nORDER BY department IS NULL, total DESC;"}
]},

{id:"row-number",cmd:"ROW_NUMBER()",cat:"win",catLabel:"VINDU",
desc:"Tildel et unikt fortløpende heltall til hver rad innenfor en partisjon.",
tags:["row_number","radnummer","sekvens","topp n","fjern duplikater"],
difficulty:"intermediate",related:["rank","window-over","cte"],
pitfalls:["ROW_NUMBER gir alltid UNIKE tall.","Filtrer i CTE eller subquery, ikke i WHERE."],
when:["Nummerér per gruppe","Topp-N per kategori","Fjern duplikater"],
examples:[
{label:"1 · Global nummerering",code:"SELECT ROW_NUMBER() OVER(ORDER BY salary DESC) AS rn, name, salary\nFROM employees;"},
{label:"2 · Per avdeling",code:"SELECT name, department, salary,\n  ROW_NUMBER() OVER(PARTITION BY department ORDER BY salary DESC) AS rn\nFROM employees;"},
{label:"3 · Topp 3 per avdeling",code:"SELECT * FROM (\n  SELECT name, department, salary,\n    ROW_NUMBER() OVER(PARTITION BY department ORDER BY salary DESC) AS rn\n  FROM employees\n) t WHERE rn <= 3;"},
{label:"4 · Siste ordre per kunde",code:"SELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER(PARTITION BY customer_id ORDER BY order_date DESC) AS rn\n  FROM orders\n) t WHERE rn = 1;"},
{label:"5 · Fjern duplikater",code:"DELETE FROM users WHERE id NOT IN (\n  SELECT min_id FROM (\n    SELECT MIN(id) AS min_id FROM users GROUP BY email\n  ) t\n);"},
{label:"6 · Paginering",code:"SELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER(ORDER BY name) AS rn FROM employees\n) t WHERE rn BETWEEN 11 AND 20;"},
{label:"7 · N-te rad",code:"SELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER(ORDER BY salary DESC) AS rn FROM employees\n) t WHERE rn = 5;"},
{label:"8 · Første ny ansatt etter 2020",code:"SELECT * FROM (\n  SELECT name, department, hire_date,\n    ROW_NUMBER() OVER(PARTITION BY department ORDER BY hire_date) AS nr\n  FROM employees WHERE hire_date >= '2020-01-01'\n) t WHERE nr = 1;"},
{label:"9 · ROW_NUMBER + AVG kombinert",code:"SELECT name, department, salary,\n  ROW_NUMBER() OVER(PARTITION BY department ORDER BY salary DESC) AS rang,\n  AVG(salary) OVER(PARTITION BY department) AS avd_snitt\nFROM employees ORDER BY department, rang;"},
{label:"10 · Sekvens-ID for eksport",code:"SELECT ROW_NUMBER() OVER(ORDER BY id) AS seq, id, name, salary\nFROM employees;"}
]},
{id:"rank",cmd:"RANK() / DENSE_RANK()",cat:"win",catLabel:"VINDU",
desc:"Ranger rader. RANK hopper over tall ved liktopp; DENSE_RANK gjør det ikke.",
tags:["rank","dense_rank","rangering","ledertavle"],
difficulty:"intermediate",related:["row-number","window-over"],
pitfalls:["RANK: 1,2,2,4. DENSE_RANK: 1,2,2,3."],
when:["Ledertavle","Salgsrangering","Persentilanalyse"],
examples:[
{label:"1 · RANK global",code:"SELECT name, salary, RANK() OVER(ORDER BY salary DESC) AS rang FROM employees;"},
{label:"2 · DENSE_RANK global",code:"SELECT name, salary, DENSE_RANK() OVER(ORDER BY salary DESC) AS rang FROM employees;"},
{label:"3 · RANK per avdeling",code:"SELECT name, department, salary,\n  RANK() OVER(PARTITION BY department ORDER BY salary DESC) AS rang\nFROM employees;"},
{label:"4 · Topp 3 rangeringer",code:"SELECT * FROM (\n  SELECT name, salary, DENSE_RANK() OVER(ORDER BY salary DESC) AS dr FROM employees\n) t WHERE dr <= 3;"},
{label:"5 · Alle tre rang-funksjoner",code:"SELECT name, salary,\n  ROW_NUMBER() OVER(ORDER BY salary DESC) AS row_n,\n  RANK()       OVER(ORDER BY salary DESC) AS rank_n,\n  DENSE_RANK() OVER(ORDER BY salary DESC) AS dense_n\nFROM employees ORDER BY salary DESC;"},
{label:"6 · Vinner per kategori",code:"SELECT * FROM (\n  SELECT category, product, revenue,\n    RANK() OVER(PARTITION BY category ORDER BY revenue DESC) AS rang\n  FROM product_sales\n) t WHERE rang = 1;"},
{label:"7 · PERCENT_RANK",code:"SELECT name, salary,\n  ROUND(PERCENT_RANK() OVER(ORDER BY salary)*100, 1) AS persentil\nFROM employees ORDER BY salary;"},
{label:"8 · NTILE — kvartiler",code:"SELECT name, salary,\n  NTILE(4) OVER(ORDER BY salary) AS kvartil\nFROM employees ORDER BY kvartil, salary;"},
{label:"9 · Salgsrangering per kvartal",code:"SELECT seller, quarter, sales,\n  RANK() OVER(PARTITION BY quarter ORDER BY sales DESC) AS rang\nFROM quarterly_sales ORDER BY quarter, rang;"},
{label:"10 · Sammenlign RANK og ROW_NUMBER",code:"SELECT name, salary,\n  RANK()       OVER(ORDER BY salary DESC) AS rank_nr,\n  ROW_NUMBER() OVER(ORDER BY salary DESC) AS row_nr\nFROM employees ORDER BY salary DESC;"}
]},
{id:"lag-lead",cmd:"LAG() / LEAD()",cat:"win",catLabel:"VINDU",
desc:"Hent verdi fra forrige (LAG) eller neste (LEAD) rad.",
tags:["lag","lead","forrige rad","neste rad","mom","yoy","differanse"],
difficulty:"intermediate",related:["window-over","running-total"],
pitfalls:["Første rad: LAG returnerer NULL. Angi standardverdi som 3. parameter."],
when:["MoM-endring","Forrige/neste verdi","Hendelsestidsanalyse"],
examples:[
{label:"1 · LAG — forrige måned",code:"SELECT month, revenue,\n  LAG(revenue) OVER(ORDER BY month) AS forrige\nFROM monthly_sales;"},
{label:"2 · LAG med standard",code:"SELECT month, revenue,\n  LAG(revenue, 1, 0) OVER(ORDER BY month) AS forrige\nFROM monthly_sales;"},
{label:"3 · Beregn endring",code:"SELECT month, revenue,\n  revenue - LAG(revenue) OVER(ORDER BY month) AS endring\nFROM monthly_sales;"},
{label:"4 · Prosentvis MoM",code:"SELECT month, revenue,\n  ROUND((revenue-LAG(revenue) OVER(ORDER BY month))\n    / LAG(revenue) OVER(ORDER BY month)*100, 1) AS pst\nFROM monthly_sales;"},
{label:"5 · LEAD — neste rad",code:"SELECT name, hire_date,\n  LEAD(hire_date) OVER(ORDER BY hire_date) AS neste_ansettelse\nFROM employees;"},
{label:"6 · LAG per partisjon",code:"SELECT dept, month, revenue,\n  LAG(revenue) OVER(PARTITION BY dept ORDER BY month) AS forrige\nFROM dept_sales;"},
{label:"7 · N perioder tilbake",code:"SELECT month, revenue,\n  LAG(revenue, 3) OVER(ORDER BY month) AS for_3_mnd\nFROM monthly_sales;"},
{label:"8 · Tid til neste hendelse",code:"SELECT user_id, event_time,\n  TIMESTAMPDIFF(MINUTE, event_time,\n    LEAD(event_time) OVER(PARTITION BY user_id ORDER BY event_time)\n  ) AS min_til_neste\nFROM user_events;"},
{label:"9 · Statusendringer",code:"SELECT id, status, changed_at,\n  LAG(status) OVER(PARTITION BY order_id ORDER BY changed_at) AS forrige_status\nFROM order_status_log;"},
{label:"10 · År-over-år",code:"SELECT år, omsetning,\n  LAG(omsetning) OVER(ORDER BY år) AS forrige_år,\n  ROUND((omsetning-LAG(omsetning) OVER(ORDER BY år))\n    / LAG(omsetning) OVER(ORDER BY år)*100, 1) AS yoy\nFROM (\n  SELECT YEAR(order_date) AS år, SUM(amount) AS omsetning\n  FROM orders GROUP BY YEAR(order_date)\n) årdata;"}
]},
{id:"running-total",cmd:"SUM() OVER — Løpende total",cat:"win",catLabel:"VINDU",
desc:"Kumulativ sum, løpende total og glidende gjennomsnitt med vindusrammer.",
tags:["løpende total","kumulativ","glidende","running total","rows between"],
difficulty:"intermediate",related:["window-over","lag-lead"],
pitfalls:["ROWS BETWEEN er eksakt — RANGE inkluderer rader med lik ORDER BY-verdi."],
when:["Kumulativ sum","Løpende saldo","Glidende snitt"],
examples:[
{label:"1 · Enkel kumulativ sum",code:"SELECT date, revenue,\n  SUM(revenue) OVER(ORDER BY date) AS kumulativ\nFROM daily_sales;"},
{label:"2 · Eksplisitt ROWS-ramme",code:"SELECT date, revenue,\n  SUM(revenue) OVER(\n    ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n  ) AS kumulativ\nFROM daily_sales;"},
{label:"3 · Glidende 3-dagers snitt",code:"SELECT date, revenue,\n  ROUND(AVG(revenue) OVER(\n    ORDER BY date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\n  ), 2) AS snitt_3d\nFROM daily_sales;"},
{label:"4 · Glidende 7-dagers sum",code:"SELECT date, revenue,\n  SUM(revenue) OVER(\n    ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n  ) AS uke_sum\nFROM daily_sales;"},
{label:"5 · Per avdeling",code:"SELECT dept, hire_date, name, salary,\n  SUM(salary) OVER(\n    PARTITION BY dept ORDER BY hire_date\n    ROWS UNBOUNDED PRECEDING\n  ) AS kum_lønn\nFROM employees;"},
{label:"6 · Kumulativ prosent av total",code:"SELECT name, salary,\n  SUM(salary) OVER(ORDER BY salary) AS kumulativ,\n  ROUND(SUM(salary) OVER(ORDER BY salary) / SUM(salary) OVER()*100, 1) AS kum_pst\nFROM employees;"},
{label:"7 · Løpende maksimum",code:"SELECT date, val,\n  MAX(val) OVER(ORDER BY date ROWS UNBOUNDED PRECEDING) AS hittil_maks\nFROM daily_records;"},
{label:"8 · Besøksstrekk 7 dager",code:"SELECT date, visitors,\n  ROUND(AVG(visitors) OVER(\n    ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n  ), 0) AS snitt_7d\nFROM web_stats;"},
{label:"9 · Kumulativ vs total",code:"SELECT month, revenue,\n  SUM(revenue) OVER(ORDER BY month ROWS UNBOUNDED PRECEDING) AS kumulativ,\n  SUM(revenue) OVER() AS total_år,\n  ROUND(SUM(revenue) OVER(ORDER BY month ROWS UNBOUNDED PRECEDING)\n    / SUM(revenue) OVER()*100, 1) AS kum_pst\nFROM monthly_sales;"},
{label:"10 · Løpende COUNT",code:"SELECT order_date, order_id,\n  COUNT(*) OVER(ORDER BY order_date ROWS UNBOUNDED PRECEDING) AS kum_ordrer\nFROM orders ORDER BY order_date;"}
]},
{id:"window-over",cmd:"OVER (PARTITION BY / ORDER BY)",cat:"win",catLabel:"VINDU",
desc:"Definer vindusrammen — bruk aggregatfunksjoner uten å fjerne rader.",
tags:["over","partition by","order by","vindu","first_value","last_value"],
difficulty:"intermediate",related:["row-number","running-total","lag-lead","rank"],
pitfalls:["Uten PARTITION BY er hele resultatet ett vindu.","ROWS er presis, RANGE er fleksibel."],
when:["Beregn per gruppe uten GROUP BY","Referanseberegninger","Prosentvis fordeling"],
examples:[
{label:"1 · AVG uten GROUP BY",code:"SELECT name, department, salary,\n  AVG(salary) OVER(PARTITION BY department) AS avd_snitt\nFROM employees;"},
{label:"2 · SUM totalt",code:"SELECT name, salary,\n  SUM(salary) OVER() AS total,\n  ROUND(salary/SUM(salary) OVER()*100, 1) AS prosent\nFROM employees;"},
{label:"3 · COUNT per gruppe",code:"SELECT name, department,\n  COUNT(*) OVER(PARTITION BY department) AS ant_i_avd\nFROM employees;"},
{label:"4 · FIRST_VALUE",code:"SELECT name, department, salary,\n  FIRST_VALUE(name) OVER(PARTITION BY department ORDER BY salary DESC) AS topp_tjener\nFROM employees;"},
{label:"5 · LAST_VALUE",code:"SELECT name, salary,\n  LAST_VALUE(salary) OVER(\n    PARTITION BY department ORDER BY salary\n    ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n  ) AS høyest_i_avd\nFROM employees;"},
{label:"6 · Prosent av avdelingstotal",code:"SELECT name, department, salary,\n  ROUND(salary/SUM(salary) OVER(PARTITION BY department)*100, 1) AS pst_av_avd\nFROM employees;"},
{label:"7 · Avvik fra avdelingssnitt",code:"SELECT name, department, salary,\n  ROUND(salary - AVG(salary) OVER(PARTITION BY department), 0) AS diff\nFROM employees;"},
{label:"8 · Kumulativ COUNT per avd",code:"SELECT name, department, hire_date,\n  COUNT(*) OVER(\n    PARTITION BY department ORDER BY hire_date\n    ROWS UNBOUNDED PRECEDING\n  ) AS ansatt_nr\nFROM employees;"},
{label:"9 · Alle vindufunksjoner sammen",code:"SELECT name, department, salary,\n  ROW_NUMBER() OVER(PARTITION BY department ORDER BY salary DESC) AS rn,\n  RANK()       OVER(PARTITION BY department ORDER BY salary DESC) AS r,\n  AVG(salary)  OVER(PARTITION BY department) AS avd_snitt,\n  SUM(salary)  OVER(PARTITION BY department ORDER BY salary) AS kum\nFROM employees ORDER BY department, salary DESC;"},
{label:"10 · ROWS vs RANGE",code:"SELECT date, amount,\n  SUM(amount) OVER(ORDER BY date ROWS  BETWEEN 1 PRECEDING AND CURRENT ROW) AS rows_s,\n  SUM(amount) OVER(ORDER BY date RANGE BETWEEN 1 PRECEDING AND CURRENT ROW) AS range_s\nFROM sales;"}
]},
{id:"cte",cmd:"WITH (CTE)",cat:"cte",catLabel:"CTE",
desc:"Gi en delspørring et navn og referer til den som en tabell (MySQL 8.0+).",
tags:["cte","with","felles tabelluttrykk","navngitt subquery","modulær"],
difficulty:"intermediate",related:["recursive-cte","subquery","create-view"],
pitfalls:["CTEer beregnes på nytt hver referanse — ikke hurtigbuffer.","Krever MySQL 8.0+."],
when:["Del opp komplekse spørringer","Erstatt nestede subqueries","Lesbarhet"],
examples:[
{label:"1 · Enkel CTE",code:"WITH høytlønte AS (\n  SELECT * FROM employees WHERE salary > 80000\n)\nSELECT department, COUNT(*) FROM høytlønte GROUP BY department;"},
{label:"2 · CTE med JOIN",code:"WITH topp AS (\n  SELECT customer_id, SUM(amount) AS total\n  FROM orders GROUP BY customer_id HAVING total > 10000\n)\nSELECT c.name, t.total\nFROM customers c JOIN topp t ON t.customer_id = c.id;"},
{label:"3 · Kjedede CTEer",code:"WITH avd_stats AS (\n  SELECT dept_id, AVG(salary) AS snitt FROM employees GROUP BY dept_id\n),\ntopp_avd AS (SELECT * FROM avd_stats WHERE snitt > 70000)\nSELECT d.dept_name, t.snitt FROM departments d\nJOIN topp_avd t ON t.dept_id = d.id;"},
{label:"4 · CTE forenkler subquery",code:"WITH total_snitt AS (SELECT AVG(salary) AS snitt FROM employees)\nSELECT name, salary FROM employees, total_snitt\nWHERE salary > snitt;"},
{label:"5 · CTE med vindufunksjon",code:"WITH ranked AS (\n  SELECT name, department, salary,\n    DENSE_RANK() OVER(PARTITION BY department ORDER BY salary DESC) AS rang\n  FROM employees\n)\nSELECT * FROM ranked WHERE rang = 1;"},
{label:"6 · To CTEer i én spørring",code:"WITH snitt AS (SELECT AVG(salary) AS s FROM employees),\n     ant   AS (SELECT COUNT(*) AS n FROM employees)\nSELECT s AS snitt, n AS antall, s*n AS total FROM snitt, ant;"},
{label:"7 · CTE for z-score",code:"WITH stats AS (\n  SELECT AVG(salary) AS mu, STDDEV(salary) AS sd FROM employees\n)\nSELECT e.name, e.salary,\n  ROUND((e.salary - s.mu)/s.sd, 2) AS z_score\nFROM employees e, stats s\nORDER BY ABS((e.salary - s.mu)/s.sd) DESC;"},
{label:"8 · CTE + INSERT",code:"WITH dyr_avd AS (\n  SELECT dept_id FROM employees\n  GROUP BY dept_id HAVING AVG(salary) > 70000\n)\nINSERT INTO budget_alerts (dept_id, created)\nSELECT dept_id, NOW() FROM dyr_avd;"},
{label:"9 · CTE for månedlig rapport",code:"WITH månedlig AS (\n  SELECT DATE_FORMAT(order_date, '%Y-%m') AS mnd, SUM(amount) AS tot\n  FROM orders GROUP BY mnd\n)\nSELECT mnd, tot, SUM(tot) OVER(ORDER BY mnd) AS kumulativ\nFROM månedlig ORDER BY mnd;"},
{label:"10 · Tre-CTE pipeline",code:"WITH raw AS (SELECT * FROM sales WHERE YEAR(date) = 2024),\nagg    AS (SELECT category, SUM(revenue) AS tot FROM raw GROUP BY category),\nranked AS (SELECT *, RANK() OVER(ORDER BY tot DESC) AS rang FROM agg)\nSELECT * FROM ranked WHERE rang <= 5;"}
]},
{id:"recursive-cte",cmd:"Rekursiv CTE",cat:"cte",catLabel:"CTE",
desc:"Traverser hierarkiske data som trær og grafer (MySQL 8.0+).",
tags:["rekursiv","hierarki","tre","org-kart","stykkliste","graf"],
difficulty:"advanced",related:["cte","self-join"],
pitfalls:["RECURSIVE-nøkkelordet er PÅKREVD.","Uten avslutningsbetingelse: stopper ved cte_max_recursion_depth (1000)."],
when:["Org-kart","Alle underordnede","Tallserier og datoer"],
examples:[
